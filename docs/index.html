n-overview", "kind": "official", "accessed": "2026-10-27"}], "uncertainties": ["Which tenants actually run the Microsoft-managed consent policy. Learn says it's the default for new tenants; tenants with custom or legacy settings are unaffected. The rollout dates (Files/Sites mid-2025, mail/calendar/mailbox/Teams around Nov 2025, Contacts/Tasks/People-type in 2026) come from secondary blogs (topedia, Nov 2025 and May 2026); the Microsoft message center posts could not be reached on 2026-10-27. We couldn't see what share of real customer tenants it covers.", "As of the Learn page updated 2026-08-28 (re-checked 2026-10-27), the exclusion list names Mail.*, Calendars.*, MailBoxSettings.*, Contacts.ReadWrite, Contacts.*.Shared, Tasks.*, People.Read and EAS/EWS/IMAP/POP, but not Mail.Send or Contacts.Read. Microsoft can change a managed policy without notice. Re-check the list before launch.", "Whether risk-based step-up consent is still active in the same form in 2026. The publisher verification page still cites the Nov 2020 rule (page updated 2026-06-15).", "Partner Center vetting time has no SLA. Estimates are from community threads and range from same day to months.", "Personal (MSA) consent experience for unverified apps: we inferred that tenant consent policies don't apply and that users see an unverified label but can consent. We couldn't confirm this without an account.", "The authorize probe returned a sign-in page (sErrorCode 50059/50058) instead of an explicit 'application not found' (AADSTS700016), because the client is validated only after sign-in. We couldn't observe the post-login error without credentials.", "Client secret maximum lifetime (the portal offers up to 24 months) is from model knowledge, not a page read in this session.", "Composio supports Outlook with managed auth according to its general docs. We didn't read the Outlook-specific toolkit page."], "meta": {"generated_at": "2026-10-27", "generated_by": "Claude (claude-opus-5-5) OAuth Runway investigator", "mode": "library", "reviewed": "On 2026-10-27 fact-checkers re-verified the Microsoft-managed consent policy (B1, partly) and publisher-verification requirements (B2, confirmed). Corrected the policy timeline (mail/calendar scopes added around Nov 2025, not mid-2025) and its scope (every app, only in tenants on the Microsoft-managed setting), and added PGA/domain details; rollout dates still rest on secondary blogs because the Microsoft message center posts were unreachable.", "collection": "library"}}, {"id": "salesforce", "name": "Salesforce", "provider": "Salesforce (External Client Apps / Connected Apps, Partner Program)", "website": "https://developer.salesforce.com", "category": "CRM", "summary": "You can connect your own Salesforce org in about an hour: create a free Developer Edition org and a local External Client App (new Connected Apps are blocked by default since Spring '26). Local ECAs cannot authorize users from other orgs. To serve arbitrary customers you need a 2GP managed package that carries a packaged ECA, and each customer's admin must install it (installation is also what the Sept 2025 uninstalled-app restriction requires for non-admin users). Once more than two customer production orgs use the app, Salesforce enforces PKCE, refresh-token rotation, a 30-day idle TTL and a refresh-token IP allowlist, which means you need static egress IPs. AppExchange security review (Salesforce estimates about 1-2 weeks readiness plus 3-4 weeks first test, plus 2-3 weeks per resubmission; $999 per review attempt for paid/freemium apps, waived for free apps) is optional unless you want a listing or Professional/Group Edition access.", "verdict": {"difficulty": 4, "label": "Per-org install", "headline": "Since Spring '26 you cannot create a new Connected App by default, and a local External Client App only works in its own org. Multi-tenant access therefore means shipping a packaged ECA in a 2GP managed package that every customer admin installs; since Sept 2025 even existing Connected Apps must be installed per org for non-admin users."}, "timeline": {"first_connection": "About 45-90 minutes: free Developer Edition org, a local ECA, then wait up to about 10 minutes for the OAuth settings to take effect.", "production": "1-3 weeks to a working 2GP package that customer admins can install, without AppExchange. For the AppExchange security review add Salesforce's stage estimates (about 1-2 weeks readiness, 3-4 weeks first test, 2-3 weeks per resubmission); community reports of 6-12 weeks including resubmissions are common, so plan around about 8 weeks. Every customer org also needs an admin to install the package before its users can connect.", "hands_on_effort": "1-3 days for 2GP setup (Dev Hub, namespace, packaged ECA, package versioning), PKCE, rotation-safe token storage and static egress IPs. Add 1-2 weeks for security review prep (scanner reports, docs, test org) if you list.", "wait_detail": "The OAuth settings themselves wait only minutes. The long waits are (a) AppExchange security review, where Salesforce documents about 1-2 weeks for readiness checks plus 3-4 weeks for the first test and 2-3 weeks per resubmission (all estimates), and queue volume drives variance, (b) the Support case to register refresh-token IP ranges, and (c) each customer's admin installing your package and adjusting policies.", "first_connection_short": "45-90 min", "production_short": "1-3 weeks", "hands_on_short": "1-3 days"}, "approval": {"needed_for_production": true, "type": "marketplace listing (optional) + per-org admin install; mandatory OAuth security controls", "trigger": "Connecting orgs other than the one that owns the app. Local ECAs are single-org. Uninstalled Connected Apps have been blocked for users without 'Approve Uninstalled Connected Apps' since Sept 2025 (enforced about Sep 2-17, 2025 for existing orgs). The mandatory partner controls kick in once more than two customer production orgs use the app. Security review is needed only to list on AppExchange, or for API access in Professional or Group Edition orgs that lack the API add-on.", "what_happens_without_it": "Without a package install in the customer org, authorization fails. A local ECA returns OAUTH_AUTHORIZATION_BLOCKED ('Cross-org OAuth flows are not supported for this external client app'). An uninstalled Connected App returns OAUTH_APPROVAL_ERROR_GENERIC or 'app must be installed into org', unless the user holds 'Approve Uninstalled Connected Apps' (System Administrator profiles have it automatically). 'Use Any API Client' no longer works around this since a security update rolling out from the week of Dec 8, 2025. Without the four controls, Salesforce may suspend the app's interoperation. Without a security review there is no AppExchange listing and no PE/GE API allowlisting.", "cost": "Building and packaging is free (Developer Edition and Dev Hub). AppExchange security review: $999 per review attempt (initial, resubmission, new version, periodic re-review) for paid, freemium and paid add-on solutions, waived for free solutions, with no annual listing fee (the $2,550 + $150/yr schedule ended in March 2023). Confirm with your Partner Account Manager, because the newest fee page would not render. Customers need Enterprise, Unlimited, Performance or Developer Edition, or Professional Edition with the API add-on. The partner program revenue share for paid apps is not covered here.", "evidence": "official", "source_ids": ["s6", "s7", "s17", "s18", "s21", "s5", "s24", "s25", "s26", "s27", "s28", "s29"]}, "managed_option": {"composio_managed": "unknown", "when_you_need_your_own": "Composio's Salesforce toolkit page describes only customer-owned credentials: you configure your own Salesforce app with Composio's callback URL. It still refers to Connected Apps and says an admin may need to install the app. Assume you need your own app (now an ECA). For multi-tenant use it must be packaged and installed per customer org whatever middleware you use."}, "prerequisites": [{"item": "Free Salesforce Developer Edition org (signup at developer.salesforce.com/signup)", "why": "It hosts your app and serves as the Dev Hub for 2GP packaging. It is API-enabled by default."}, {"item": "Dev Hub enabled plus a registered namespace (ideally in a Partner Business Org if you join the partner program)", "why": "Packaged ECAs ship only in second-generation managed packages, and a packaged ECA should live in a long-lived org."}, {"item": "Static, publicly routable egress IPs for your token-refresh traffic", "why": "The refresh-token IP allowlist is mandatory for partner apps used by more than two customer production orgs. Refreshes from other IPs fail with 'IP restricted by the app developer'."}, {"item": "Customers on an edition with API access", "why": "Enterprise, Unlimited, Performance and Developer have it. Professional needs the add-on or a security-reviewed allowlisted app. Essentials, Starter and Group have none."}, {"item": "Salesforce CLI (sf)", "why": "You need it to retrieve ECA metadata, set distributionState=Packaged and create package versions."}], "phases": [{"name": "Create the app", "goal": "A working ECA in your own org", "duration": "30-60 minutes", "steps": [{"title": "Sign up for a Developer Edition org", "detail": "Free. Verify the email and set a password. This org becomes your Dev Hub and app-owning org.", "owner": "you", "effort": "10 min", "url": "https://developer.salesforce.com/signup", "evidence": "tested", "source_ids": ["s4"]}, {"title": "Create an External Client App, not a Connected App", "detail": "Setup > External Client App Manager > New. Enter the name, contact email, Enable OAuth, a callback URL (exact match, https or http://localhost), and scopes such as api, refresh_token and id/openid. Tick 'Require PKCE' and 'Require secret for web server flow'. New Connected App creation has been disabled by default in all orgs since Spring '26; Support can grant a temporary exception that Salesforce says will be removed.", "owner": "you", "effort": "15 min", "url": "https://login.salesforce.com/lightning/setup/ManageExternalClientApplication/home", "evidence": "official", "source_ids": ["s5", "s13", "s21", "s24"]}, {"title": "Copy the consumer key and secret", "detail": "In the ECA Settings tab under OAuth Settings, use 'Consumer Key and Secret' (it may require an email verification code). These become client_id and client_secret. Keep the secret out of source control; global OAuth settings are never packaged.", "owner": "you", "effort": "5 min", "evidence": "community", "source_ids": ["s12", "s11"]}, {"title": "Generate config and the PKCE auth-code client", "detail": "An agent can write the authorize and token calls with S256 PKCE, store instance_url per connection, and route sandbox users to test.salesforce.com or their My Domain.", "owner": "agent", "effort": "30-60 min", "evidence": "tested", "source_ids": ["s1", "s2"]}]}, {"name": "Configure & test", "goal": "Complete a real OAuth connection and API call against your own org", "duration": "About 30 minutes plus up to 10 minutes propagation", "steps": [{"title": "Set ECA policies", "detail": "On the Policies tab, set Permitted Users (All users may self-authorize, or Admin-approved with a permission set), the refresh token policy, IP relaxation and session timeout (the access token lifetime follows this).", "owner": "you", "effort": "10 min", "evidence": "community", "source_ids": ["s9", "s11"]}, {"title": "Run the web-server flow end to end", "detail": "Redirect to /services/oauth2/authorize with response_type=code, code_challenge and code_challenge_method=S256. Exchange the code at /services/oauth2/token, then call {instance_url}/services/data/vXX.X/sobjects. Use the user's My Domain login URL where possible.", "owner": "agent+you", "effort": "20 min", "evidence": "tested", "source_ids": ["s1", "s2", "s3"]}, {"title": "Implement rotation-safe refresh", "detail": "Persist the new refresh token on every refresh, with a single writer per user-app pair and no retries with an already-used token, because reuse revokes the whole family. Add a heartbeat refresh before 30 days of idleness. Handle invalid_grant by re-prompting.", "owner": "agent", "effort": "2-4 h", "evidence": "official", "source_ids": ["s6", "s7", "s14"]}]}, {"name": "Ship to other orgs (package + install)", "goal": "Users in any customer org can connect", "duration": "1-3 weeks", "steps": [{"title": "Enable Dev Hub, register a namespace and set up 2GP", "detail": "Create an sfdx project and retrieve the ECA metadata. Set distributionState=Packaged, keep the global OAuth settings and policy files out of the package (.forceignore), then create and promote a managed package version.", "owner": "agent+you", "effort": "0.5-2 days", "evidence": "official", "source_ids": ["s12", "s11", "s25"]}, {"title": "Move refresh traffic to static egress IPs and register them", "detail": "Register the ranges with Salesforce, which the community describes as a Support case. Add the ranges, wait 30-45 minutes, then tick 'Enforce Refresh Token IP Allowlist'. Lock the controls via 'Review Controls'; this is permanent.", "owner": "you", "effort": "0.5-1 day + case wait", "evidence": "official", "source_ids": ["s6", "s14"]}, {"title": "Customer admin installs the package", "detail": "Send each customer the install URL. The admin installs it, opens the ECA in App Manager, and sets Permitted Users and policies. Users can authorize only after this. This install is required both for packaged ECAs and, since Sept 2025, for any Connected App used by non-admin users.", "owner": "you", "effort": "Per customer, 10-30 min of their admin's time", "evidence": "community", "source_ids": ["s11", "s9", "s22", "s25", "s26"]}]}, {"name": "Optional: AppExchange security review", "goal": "AppExchange listing, customer trust, PE/GE API allowlisting", "duration": "Salesforce estimates about 1-2 weeks readiness + 3-4 weeks first test + 2-3 weeks per resubmission; plan for about 8 weeks", "steps": [{"title": "Join the Salesforce Partner Program and get a Partner Business Org", "detail": "This is required to list. Link your packaging org in the Partner Console.", "owner": "you", "effort": "1-2 h", "url": "https://partners.salesforce.com/", "evidence": "inferred", "source_ids": []}, {"title": "Prepare the submission", "detail": "Include Code Analyzer and DAST scan reports for your external web app and API endpoints, architecture and data-flow docs, a test org and test credentials. An agent can run the scanners and draft the docs; you sign off on the false-positive explanations.", "owner": "agent+you", "effort": "3-10 days", "evidence": "official", "source_ids": ["s17", "s29"]}, {"title": "Salesforce reviews", "detail": "About 1-2 weeks of submission readiness checks, then 3-4 weeks for the first Product Security test (Salesforce estimates). Failures come back as a report that you must fix and resubmit; each resubmission takes about 2-3 weeks and costs another review fee for paid apps.", "owner": "provider", "effort": "5-6 weeks wait + 2-3 weeks per resubmission", "evidence": "official", "source_ids": ["s17", "s29", "s28"]}, {"title": "Request PE/GE API access if needed", "detail": "After approval, ask for REST allowlisting of your app, or a SOAP API token via a Partner Community case, so customers on Professional or Group Edition can connect without the API add-on. Bulk API stays unavailable.", "owner": "you", "effort": "1 h + case wait", "evidence": "official", "source_ids": ["s18"]}]}], "config": {"console_url": "https://login.salesforce.com/lightning/setup/ManageExternalClientApplication/home (Setup > External Client App Manager)", "authorize_url": "https://login.salesforce.com/services/oauth2/authorize (sandboxes: test.salesforce.com; better: https://{MyDomain}.my.salesforce.com/services/oauth2/authorize)", "token_url": "https://login.salesforce.com/services/oauth2/token", "redirect_uri_rules": "The callback URL must exactly match one registered on the app. Use https, or http://localhost for local development. Several URLs can be listed. A mixed list that includes an https URL triggers all four mandatory controls, including the IP allowlist. Changes can take up to about 10 minutes for Connected Apps; ECA source-org changes are reported as immediate.", "pkce": "Supported with S256 only (discovery advertises code_challenge_methods_supported=['S256']). It is mandatory for auth-code flows of partner apps used by more than two customer production orgs, and enforced from mid-2026.", "refresh_tokens": "Request the refresh_token or offline_access scope. The default policy keeps the token valid until revoked, but partner apps in scope must use rotation (each refresh returns a new token; reusing an old one revokes the family), a 30-day sliding idle TTL and an IP allowlist (up to 10,000 IPs). The access token lifetime follows the session timeout policy (commonly 2 hours) and returns no expires_in. Always use the instance_url from the token response.", "scopes": [{"scope": "api", "tier": "basic", "note": "REST/SOAP/Bulk access to all objects the user can see. This is the core scope an agent needs for read and write; actual access is governed by the user's profile and permission sets."}, {"scope": "refresh_token / offline_access", "tier": "basic", "note": "Required for background agent access; subject to rotation, idle TTL and IP allowlist for partner apps."}, {"scope": "openid / id / profile / email", "tier": "basic", "note": "Identity URL and user info."}, {"scope": "full", "tier": "admin-consent", "note": "Everything the user can access; avoid. Reviewers and admins push back on over-broad scopes."}, {"scope": "web / visualforce / lightning", "tier": "basic", "note": "UI-session use cases; not needed for API agents."}, {"scope": "chatter_api", "tier": "basic", "note": "Connect REST (Chatter, files)."}, {"scope": "mcp_api", "tier": "product-gated", "note": "Listed in the live discovery document. Apparently for Salesforce-hosted MCP servers; check availability per org."}, {"scope": "einstein_gpt_api / cdp_* / sfap_api", "tier": "product-gated", "note": "Agentforce, Einstein and Data Cloud APIs; only useful if the org has those licenses."}], "evidence": "tested", "source_ids": ["s1", "s2", "s3", "s6"]}, "gotchas": [{"title": "New Connected Apps are blocked by default since Spring '26", "detail": "Creation is disabled in all orgs through both the UI and the API. Support can grant a temporary exception, which Salesforce says will be removed. Existing Connected Apps keep working. Build on External Client Apps; Connected App to ECA migration is one-way.", "impact": "blocker", "evidence": "official", "source_ids": ["s5", "s13", "s21", "s24"]}, {"title": "A local ECA cannot connect other orgs", "detail": "A Connected App defined in org A could authorize users in org B without an install. A local ECA works only in its own org; a packaged ECA works only where installed. Cross-org attempts fail with OAUTH_AUTHORIZATION_BLOCKED: 'Cross-org OAuth flows are not supported for this external client app'. Local ECAs cannot be distributed: set Distribution State = Packaged and ship the ECA in a 2GP managed package (global OAuth settings, i.e. the consumer key/secret, stay in the owner org and are not packaged). Per-customer installation is not only an ECA requirement: the Sept 2025 uninstalled-app restriction requires it for non-admin users of Connected Apps too.", "impact": "blocker", "evidence": "community", "source_ids": ["s11", "s10", "s25"]}, {"title": "Uninstalled apps are blocked for most users (since Sept 2025)", "detail": "Enforced from about Sep 2-17, 2025 for existing orgs and from Aug 28/Sep 1, 2025 for new orgs. Even legacy Connected Apps now need the customer admin to install them (Setup > Connected Apps OAuth Usage > Install). Only the 'Approve Uninstalled Connected Apps' permission still bypasses this (System Administrator profiles have it automatically). 'Use Any API Client' no longer lets users self-authorize uninstalled apps since a security update rolling out from the week of Dec 8, 2025, so do not rely on it; have customers install the app/package. Previously authorized users were generally exempt, but device flow from uninstalled apps is blocked for everyone.", "impact": "blocker", "evidence": "official", "source_ids": ["s8", "s9", "s22", "s26", "s27"]}, {"title": "Mandatory OAuth controls for partner apps, including a refresh-token IP allowlist", "detail": "PKCE, refresh-token rotation, a 30-day idle TTL and a refresh-token IP allowlist apply to partner-owned CAs and ECAs used by more than two customer production orgs. The deadline was May 11, 2026, enforcement has started, and the controls cannot be disabled once locked. Serverless or rotating-IP backends must move refresh traffic behind static egress IPs.", "impact": "blocker", "evidence": "official", "source_ids": ["s6", "s7"]}, {"title": "API access depends on the customer's edition", "detail": "Enterprise, Unlimited, Performance and Developer include it. Professional needs the API add-on, or your app must pass security review and be allowlisted. Essentials, Starter and Group have none. Calls to an org without API access return API_DISABLED_FOR_ORG, and the user also needs the 'API Enabled' permission.", "impact": "blocker", "evidence": "official", "source_ids": ["s19", "s18"]}, {"title": "Rotation races revoke the whole token family", "detail": "Two agent workers refreshing at once, or a retry with an already-used refresh token, invalidates all refresh tokens for that user and app. Serialize refreshes per connection.", "impact": "delay", "evidence": "community", "source_ids": ["s14"]}, {"title": "Daily API limits are per org, not per app", "detail": "Enterprise gets 100,000 calls per rolling 24h plus 1,000 per Salesforce license. A chatty agent competes with the customer's other integrations for the same pool.", "impact": "nuance", "evidence": "official", "source_ids": ["s20"]}, {"title": "Use the org's My Domain and instance_url", "detail": "Hard-coding na*.salesforce.com or login.salesforce.com breaks sandboxes (test.salesforce.com) and some ECA cases. Store the returned instance_url per connection.", "impact": "nuance", "evidence": "community", "source_ids": ["s23"]}, {"title": "More legacy flow retirements are scheduled", "detail": "Device flow is restricted to local ECAs with localhost callbacks from Nov 30, 2026. Username-password and user-agent flows retire around Feb 2027. Use the web-server (auth code + PKCE) flow.", "impact": "nuance", "evidence": "community", "source_ids": ["s16"]}], "blockers": [{"symptom": "error=OAUTH_AUTHORIZATION_BLOCKED, 'Cross-org OAuth flows are not supported for this external client app'", "what_to_do": "You are using a local ECA, or a packaged ECA not installed in that org. Ship the ECA in a 2GP managed package and have the customer admin install it. Also try the org's My Domain login URL.", "evidence": "community", "source_ids": ["s10", "s11", "s23", "s25"]}, {"symptom": "OAUTH_APPROVAL_ERROR_GENERIC or error_description=app must be installed into org", "what_to_do": "Uninstalled-app restriction. Have the admin install the app or package (Setup > Connected Apps OAuth Usage > Install) and set Permitted Users. Granting 'Approve Uninstalled Connected Apps' is the only per-user bypass; 'Use Any API Client' no longer works since the Dec 2025 security update.", "evidence": "official", "source_ids": ["s9", "s22", "s26", "s27"]}, {"symptom": "OAUTH_APP_ACCESS_DENIED / user is not admin approved", "what_to_do": "Permitted Users is set to admin-approved. The admin must assign the app via a profile or permission set, or switch to 'All users may self-authorize'.", "evidence": "community", "source_ids": ["s9"]}, {"symptom": "Refresh fails with 'IP restricted by the app developer'", "what_to_do": "The refresh call left from an IP outside your registered allowlist. Route token refreshes through static egress IPs and add them to the allowlist.", "evidence": "official", "source_ids": ["s6"]}, {"symptom": "invalid_grant on refresh after weeks of inactivity, or after a retry", "what_to_do": "The 30-day idle TTL expired, or a rotated token was reused. Re-prompt the user to connect, add a heartbeat refresh at about 25 days, and serialize refreshes.", "evidence": "official", "source_ids": ["s6", "s14"]}, {"symptom": "API_DISABLED_FOR_ORG on first API call", "what_to_do": "The customer's edition has no API access, typically Professional without the add-on, or Essentials, Starter or Group. They must buy the add-on or upgrade, or your security-reviewed app must be allowlisted for PE.", "evidence": "official", "source_ids": ["s19", "s18"]}, {"symptom": "'New Connected App' button missing or disabled in Setup", "what_to_do": "Expected since Spring '26. Use External Client App Manager instead, or file a Support case for a temporary exception (not recommended).", "evidence": "community", "source_ids": ["s5"]}, {"symptom": "Security review comes back 'Failed' with a findings report", "what_to_do": "Fix the findings, or document false positives with justification, then resubmit. Each resubmission puts you back in the multi-week queue.", "evidence": "official", "source_ids": ["s17"]}], "handoff": {"agent_can": ["Write the PKCE (S256) web-server flow, token exchange, per-connection instance_url storage and My Domain/sandbox login routing", "Implement rotation-safe refresh-token storage (atomic swap, per-connection lock, 25-day heartbeat, invalid_grant re-prompt)", "Scaffold the sfdx/2GP project: retrieve ECA metadata, set distributionState=Packaged, write .forceignore, create package versions", "Draft the customer admin install guide (install URL, Permitted Users policy, permission set, edition and API requirements)", "Run Salesforce Code Analyzer and an OWASP ZAP or DAST scan, and draft security-review architecture, data-flow and false-positive docs", "Probe the authorize and token endpoints and generate the scope list and callback config"], "you_must": ["Sign up for the Developer Edition org and log into Setup (email verification, MFA)", "Create the ECA in the UI and copy the consumer key and secret (email verification code)", "Register the namespace, enable Dev Hub, and decide whether to join the Partner Program", "Provision static egress IPs and file the Support case to register them; lock the controls (permanent)", "Get each customer's Salesforce admin to install the package and set policies", "Submit and pay for AppExchange security review if listing a paid app, and own the reviewer back-and-forth"]}, "tests": [{"check": "OIDC discovery document", "method": "curl https://login.salesforce.com/.well-known/openid-configuration", "result": "200 JSON. issuer=https://login.salesforce.com; authorization_endpoint=.../services/oauth2/authorize; token_endpoint=.../services/oauth2/token; code_challenge_methods_supported=['S256']; grant_types_supported=['authorization_code','refresh_token']; token_endpoint_auth_methods_supported includes client_secret_post/basic, private_key_jwt, tls_client_auth; scopes_supported includes api, refresh_token, offline_access, full, openid, id, chatter_api, mcp_api, a2a_api, einstein_gpt_api, cdp_* (38 total).", "supports": "Endpoint URLs, S256-only PKCE, scope list"}, {"check": "RFC 8414 metadata", "method": "curl https://login.salesforce.com/.well-known/oauth-authorization-server", "result": "HTTP 404", "supports": "Use OIDC discovery, not RFC 8414, at the login host"}, {"check": "Authorize endpoint with dummy client_id", "method": "GET https://login.salesforce.com/services/oauth2/authorize?client_id=oauth-runway-probe&redirect_uri=https://example.com/cb&response_type=code", "result": "HTTP 400, body: error=invalid_client_id&error_description=client%20identifier%20invalid (no redirect to the callback). test.salesforce.com returned HTTP 400 too.", "supports": "Endpoint is li d client-credentials flows differs between sources.", "Composio's managed Salesforce auth was not confirmed. Its toolkit doc describes customer-owned credentials only.", "The mcp_api and a2a_api scopes appear in live discovery, but their requirements were not researched.", "Unresolved: the current AppExchange security review fee. The $999-per-attempt figure (waived for free solutions, no annual fee) comes from an indexed copy of the packaging guide fee table; the newest Salesforce fee page would not render on 2026-10-27. Confirm the fee with your Partner Account Manager.", "The 'Use Any API Client' change (Dec 2025 security update) was confirmed only from a search-index copy of Salesforce help article 005228838; the page itself did not render."], "meta": {"generated_at": "2026-10-27", "generated_by": "OAuth Runway research agent (Claude Opus 5.5)", "mode": "library", "reviewed": "On 2026-10-27 fact-checkers re-verified the Spring '26 Connected App block and ECA packaging (B3, partly), the Sept 2025 uninstalled-app restriction (B4, partly) and AppExchange fees/timeline (B5, wrong). Corrected the fee to $999 per review attempt (no annual fee), replaced '4-6 weeks' with Salesforce's per-stage estimates, and dropped 'Use Any API Client' as a workaround; the $999 fee page and help article 005228838 did not render, so both remain to confirm.", "collection": "library"}}, {"id": "slack", "name": "Slack", "provider": "Slack (Salesforce)", "website": "https://api.slack.com/apps", "category": "Team chat / collaboration", "summary": "Creating a Slack app and connecting your own workspace takes about 30 minutes, and switching on 'public distribution' lets any workspace install it the same day with no review. That unlisted route is a trap for AI agents, though. Since 29 May 2025, new installs of commercially distributed apps that are not on the Marketplace are limited to 1 request per minute (15 messages) on conversations.history/replies, and they cannot use the Real-time Search API. A real production launch means a Slack Marketplace listing: you need 10+ active installs before you can submit, then up to 10 business days of preliminary review and up to 10 weeks of functional review. Plan on 2-4 months.", "verdict": {"difficulty": 4, "label": "Marketplace review", "headline": "Unlisted apps install anywhere instantly, but a commercial agent is throttled to 1 history read per minute until it passes Marketplace review (10 active installs to submit, then up to ~12 weeks of review)."}, "timeline": {"first_connection": "20-45 minutes (create app, add scopes, install to your own workspace; needs an HTTPS redirect for anything beyond a localhost server redirect)", "production": "2-4 months: 1-4 weeks to collect 10 active installs, then up to 10 business days preliminary review plus up to 10 weeks functional review, plus any resubmission rounds", "hands_on_effort": "1-2 days of engineering (OAuth install flow, multi-workspace token storage, request signing, uninstall/data deletion) plus 1-2 days for Marketplace assets (landing page, privacy policy, support page, scope justifications, demo video, test workspace)", "wait_detail": "Most of the wait is Slack's review queue: official guidance is 'up to 10 business days' for preliminary review and 'up to 10 weeks' for functional review on new submissions. The queue cannot be expedited, and resubmitting during preliminary review resets your place. The other wait is the gate before you can submit at all: the app must sit on 10+ workspaces that were active in the last 28 days, and it must keep that count for the whole review. Requesting enhanced-review scopes (*:history, search:read.*, files:read) adds variance.", "first_connection_short": "20-45 min", "production_short": "2-4 months", "hands_on_short": "1-2 days"}, "approval": {"needed_for_production": true, "type": "marketplace listing", "trigger": "Commercial distribution to workspaces outside your own. Slack's developer policy says apps meant for commercial distribution at scale should go through Marketplace review. In practice the trigger is that unlisted apps get Tier 1 limits on conversations.history/replies (1 req/min, 15 objects) and are barred from the Real-time Search API.", "what_happens_without_it": "Without public distribution, only the workspace that created the app can install it (error invalid_team_for_non_distributed_app). With public distribution but no listing ('unlisted'), any workspace can install through OAuth, unless its admins restrict installs to approved or Marketplace apps. For new installs since 29 May 2025, unlisted apps get 1 request/minute and at most 15 messages per call on conversations.history and conversations.replies, with no access to the Real-time Search API (assistant.search.context).", "cost": "No listing or review fee found. Free Slack workspaces are enough to develop and test, but semantic search via the RTS API needs customers on Business+ or Enterprise+, and the Agent/Assistant container UI needs a paid plan.", "evidence": "official", "source_ids": ["s3", "s4", "s5", "s6", "s9", "s14"]}, "managed_option": {"composio_managed": "unknown", "when_you_need_your_own": "You need your own app as soon as you distribute commercially. Marketplace review, the rate-limit tier and the scope approvals all attach to the app (client ID), so a shared managed app inherits whatever tier it has. Your own listed app is the only route to Tier 3 history limits and RTS access under your brand."}, "prerequisites": [{"item": "A Slack workspace where you can install apps (free is fine)", "why": "Apps are created at api.slack.com/apps and installed first into a development workspace."}, {"item": "Public HTTPS endpoint for the OAuth redirect and Events/interactivity URLs", "why": "Distributed apps need SSL on their redirect and request URLs; http://localhost works only as a server redirect for local testing."}, {"item": "10+ separate active workspaces using the app (for Marketplace)", "why": "Submissions are blocked below 10 workspaces that were active (used) in the last 28 days; sandboxes do not count, and the count must hold throughout the review. The guidelines also reject apps with fewer than 10 weekly active users."}, {"item": "Public landing page, privacy policy and support page", "why": "Required Marketplace listing assets; the support contact must not require creating an account and must respond within 2 business days."}, {"item": "Real in-Slack functionality (bot, App Home, shortcuts, assistant UI)", "why": "The Marketplace does not accept apps with no meaningful in-Slack functionality, including apps that only provide an MCP server."}], "phases": [{"name": "Create the app", "goal": "A Slack app with client ID/secret and the right scopes", "duration": "15-30 minutes", "steps": [{"title": "Sign in and open the app console", "detail": "api.slack.com/apps shows a 'sign in to your Slack account' page until you log in. Click Create New App, choose 'From a manifest' (recommended so the agent can generate it) or 'From scratch', and pick your development workspace.", "owner": "you", "effort": "5 min", "url": "https://api.slack.com/apps", "evidence": "tested", "source_ids": ["t4"]}, {"title": "Generate the app manifest", "detail": "The manifest holds the app name, bot user, oauth_config.redirect_urls, bot scopes (scope) and user scopes (user_scope), event subscriptions and token_rotation_enabled. An AI agent usually needs bot scopes such as chat:write, channels:read, channels:history, groups:history, im:history, users:read and app_mentions:read, plus assistant:write if you use the Agent/Assistant container. Prefer bot tokens; use user scopes only where the app must act as the user.", "owner": "agent", "effort": "15 min", "evidence": "official", "source_ids": ["s2", "s6"]}, {"title": "Decide on token rotation and PKCE before the first install", "detail": "Token rotation (12h access tokens + single-use refresh tokens) cannot be turned off once enabled. PKCE makes the Marketplace)", "goal": "Listed app with Tier 3 limits and approved scopes", "duration": "6-12 weeks of review after submission", "steps": [{"title": "Prepare listing assets and AI disclosures", "detail": "You need a landing page (public, built for the Slack app, with install path and privacy link), a privacy policy (data collected, use, retention, access/deletion, contact), a support page, a short description of 10 words or fewer, a long description with an LLM-inaccuracy disclaimer, at least one 1600x1000 image, and the model used plus retention, tenancy and residency in Security & Compliance. Apps that use the Agent/Assistant UI must be zero-copy: do not store Slack data, store metadata only and fetch in real time. Every AI app must disclose data retention, tenancy and residency.", "owner": "agent+you", "effort": "1 day", "evidence": "official", "source_ids": ["s6", "s18"]}, {"title": "Write scope justifications and record a demo video", "detail": "Justify each scope against features that exist and can be tested. *:history, search:read.*, files:read and canvases:read trigger enhanced review. Record the demo: install, OAuth, setup, end-to-end use, uninstall. Provide a test workspace and test accounts with dummy data, since reviewers cannot get into your workspaces.", "owner": "agent+you", "effort": "3-6 h", "evidence": "official", "source_ids": ["s5", "s6"]}, {"title": "Submit and pass preliminary review", "detail": "Slack checks listing information, docs, scope justifications and installability. Feedback comes in 'up to 10 business days'. Resubmitting at this stage resets your queue position.", "owner": "provider", "effort": "up to 10 business days", "evidence": "official", "source_ids": ["s5", "s17"]}, {"title": "Functional review", "detail": "A reviewer tests the app and each scope. Feedback comes in 'up to 10 weeks for new submissions' (6 weeks for updates to published apps). The review cannot be expedited. Once listed, any later change to scopes, endpoints or listing goes back through review.", "owner": "provider", "effort": "up to 10 weeks", "evidence": "official", "source_ids": ["s5", "s10", "s17"]}]}], "config": {"console_url": "https://api.slack.com/apps", "authorize_url": "https://slack.com/oauth/v2/authorize (user-only: https://slack.com/oauth/v2_user/authorize; Sign in with Slack/OIDC: https://slack.com/openid/connect/authorize)", "token_url": "https://slack.com/api/oauth.v2.access (OIDC: https://slack.com/api/openid.connect.token)", "redirect_uri_rules": "The redirect_uri must match, or be a subdirectory of, a Redirect URL registered under OAuth & Permissions. Same host and port, no '#' anchor, HTTPS required for distributed apps. If several redirect URLs are registered, send the identical redirect_uri in both authorize and oauth.v2.access, or you get bad_redirect_uri. http://localhost is accepted, as a server redirect without PKCE or a desktop redirect with PKCE. Desktop redirects (custom scheme or PKCE localhost) cannot request bot scopes.", "pkce": "Optional, S256 only, generally available since 30 March 2026. Enabling it makes the app a public client (one-way, only Slack support can undo it) and makes refresh tokens expire after 30 days. Server-side agents should normally leave it off.", "refresh_tokens": "By default, access tokens (xoxb/xoxp) never expire until revoked or uninstalled. With token rotation enabled (irreversible), access tokens expire every 12 hours, and refresh tokens are single-use, redeemed via oauth.v2.access with grant_type=refresh_token. PKCE apps get refresh tokens that expire after 30 days.", "scopes": [{"scope": "chat:write", "tier": "basic", "note": "Post messages as the bot"}, {"scope": "app_mentions:read", "tier": "basic", "note": "Receive @mentions; also a source of action_token for RTS calls"}, {"scope": "channels:read / groups:read / im:read / users:read", "tier": "basic", "note": "List conversations and users"}, {"scope": "channels:history / groups:history / im:history / mpim:history", "tier": "enhanced review", "note": "Read messages. For unlisted commercial apps, conversations.history/replies are capped at 1 req/min and 15 objects. Broad user-token *:history is unlikely to be approved without a use case like real-time search or MCP."}, {"scope": "search:read.public (+ search:read.private/.im/.mpim/.files/.users)", "tier": "enhanced review; Marketplace or internal apps only", "note": "Real-time Search API (assistant.search.context). Results may not be stored or used for training. The legacy search:read scope is prohibited."}, {"scope": "files:read / canvases:read", "tier": "enhanced review", "note": "Read file and canvas contents"}, {"scope": "assistant:write", "tier": "basic (paid-plan feature)", "note": "Agent/Assistant container UI; the listing must say a paid plan is required"}, {"scope": "admin.*, identity.*, legacy search:read, triggers:*", "tier": "restricted", "note": "Not accepted for Marketplace except via partner programs"}, {"scope": "openid, profile, email", "tier": "basic (Sign in with Slack)", "note": "The only scopes advertised by the OIDC discovery document. Cannot be combined with other user scopes in one flow."}], "evidence": "official", "source_ids": ["s2", "s6", "s7", "s8", "s11", "s13", "t1", "t2", "t3"]}, "gotchas": [{"title": "Unlisted commercial apps are throttled to 1 history call per minute", "detail": "Since 29 May 2025, new unlisted (non-Marketplace) commercially distributed apps, and new installs of existing ones, get Tier 1 on conversations.history and conversations.replies: about 1 request/minute, with limit max/default of 15 objects. Internal customer-built apps keep Tier 3 (50+/min, up to 1,000 objects). Whether installs made before 29 May 2025 are also covered is unresolved (see uncertainties). An agent that summarizes or answers over channel history is close to unusable at this rate.", "impact": "blocker", "evidence": "official", "source_ids": ["s3", "s14", "s15"]}, {"title": "Real-time Search API is closed to unlisted distributed apps", "detail": "The Real-time Search API (the search path Slack prefers for AI agents) is available only to directory-published apps and internal apps. The page has a heading saying no unlisted distributed apps are allowed.", "impact": "blocker", "evidence": "official", "source_ids": ["s11"]}, {"title": "You need 10 active installs before you can even submit", "detail": "Since July 2026 (raised from the 5 installs required from August 2025), Marketplace submission requires 10+ workspaces active in the last 28 days, maintained for the whole review. Sandboxes do not count, and the guidelines also reject apps with fewer than 10 weekly active users. You have to collect pilots while running on the throttled unlisted tier.", "impact": "delay", "evidence": "official", "source_ids": ["s4", "s5", "s16", "s17", "s18"]}, {"title": "No training on Slack data; Agent/Assistant UI apps must be zero-copy", "detail": "The developer policy and the Marketplace guidelines (both the unsuitable-apps list and the generative-AI rules) prohibit using Slack data to train an LLM, and the developer policy requires deleting data within 14 business days of uninstall. The no-storage rule is narrower: apps using the Agent/Assistant UI must not store Slack data they obtain (store metadata only, i.e. zero-copy). The general generative-AI section does not ban storage but requires you to disclose retention, data tenancy and data residency. RTS results may not be stored or copied. A RAG design that indexes the workspace will be rejected if you use the Agent/Assistant UI or RTS. Requests for *:history and similar scopes trigger enhanced review.", "impact": "blocker", "evidence": "official", "source_ids": ["s12", "s6", "s11", "s18"]}, {"title": "MCP-only or headless agents are not listable", "detail": "The Marketplace does not accept apps with no meaningful in-Slack functionality, including apps that only provide an MCP server. If your agent only uses Slack as a data source and lives in your own UI, add real in-Slack surfaces (bot, assistant pane, App Home) or you will be rejected.", "impact": "blocker", "evidence": "official", "source_ids": ["s6", "s18"]}, {"title": "Review is long and cannot be expedited", "detail": "Preliminary review takes up to 10 business days and functional review up to 10 weeks. Resubmitting during preliminary review resets the queue, and every later scope or endpoint change goes back through review. Do not plan a launch date around Slack approval.", "impact": "delay", "evidence": "official", "source_ids": ["s5", "s10", "s17"]}, {"title": "Token rotation and PKCE are one-way switches", "detail": "Rotation cannot be turned off once enabled. Enabling PKCE makes the app a public client permanently (only Slack support can undo it) and limits refresh tokens to 30 days.", "impact": "nuance", "evidence": "official", "source_ids": ["s7", "s8"]}, {"title": "Workspace admins can block unlisted installs", "detail": "Some workspaces only allow approved or Marketplace apps, or require admin approval, so pilot installs in larger orgs may stall on an admin request.", "impact": "delay", "evidence": "official", "source_ids": ["s9"]}, {"title": "Scopes are additive and cannot be removed from a token", "detail": "Requesting scopes 'just in case' sticks to existing tokens, and reviewers reject scopes for features that do not exist yet.", "impact": "nuance", "evidence": "official", "source_ids": ["s2", "s5"]}], "blockers": [{"symptom": "invalid_team_for_non_distributed_app on install", "what_to_do": "Public distribution is not active. Complete the Manage Distribution checklist and click Activate Public Distribution.", "evidence": "official", "source_ids": ["s2", "s9"]}, {"symptom": "bad_redirect_uri", "what_to_do": "Send the exact same redirect_uri to authorize and oauth.v2.access, and make sure it matches (or is a subdirectory of) a registered Redirect URL with the same host, port and https.", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "unapproved_scope from a published app", "what_to_do": "The scope was added but not approved by Marketplace review. Submit the scope change and wait for approval, or drop it.", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "invalid_code from oauth.v2.access", "what_to_do": "The code was already used, has expired (10 minutes) or is bogus. Restart the authorize flow. The same response comes back for a fake client_id, so also check client_id and secret.", "evidence": "tested", "source_ids": ["t3", "s2"]}, {"symptom": "ratelimited / HTTP 429 on conversations.history with limit capped at 15", "what_to_do": "You are on the unlisted-app Tier 1. Cache metadata only, use Events API pushes instead of polling, move search to RTS once listed, and prioritize Marketplace submission.", "evidence": "official", "source_ids": ["s3"]}, {"symptom": "Marketplace submission button blocked", "what_to_do": "You have fewer than 10 workspaces active in the last 28 days (sandboxes do not count). Grow pilots first. Exemptions apply only to security/compliance partners using the Discovery API.", "evidence": "official", "source_ids": ["s5", "s16"]}, {"symptom": "Rejected for broad scopes (*:history, search:read, admin.*)", "what_to_do": "Cut to least-privilege bot scopes, swap legacy search:read for search:read.public via RTS, and tie each scope to a feature shown in the demo video.", "evidence": "official", "source_ids": ["s5", "s6"]}], "handoff": {"agent_can": ["Generate the full app manifest (bot/user scopes, redirect URLs, events, token rotation setting) for you to paste into 'Create New App > From a manifest'", "Implement the OAuth v2 install flow, state check, per-team token storage, refresh with grant_type=refresh_token, and request-signature verification", "Implement uninstall handling (app_uninstalled/tokens_revoked) and the 14-business-day data deletion", "Redesign data access to be zero-copy (metadata only, real-time fetch; required for Agent/Assistant UI apps) and to use Events API instead of polling history, and draft the retention/tenancy/residency disclosure", "Draft the landing page, privacy policy (collection, use, retention, deletion, LLM model, tenancy, residency) and support page copy", "Write per-scope Marketplace justifications, the short and long descriptions with the LLM-inaccuracy disclaimer, and the demo-video script", "Probe endpoints and decode OAuth errors (bad_redirect_uri, invalid_code, unapproved_scope)"], "you_must": ["Sign in to api.slack.com/apps and create the app in a workspace you control", "Decide, irreversibly, whether to enable token rotation and/or PKCE", "Click Activate Public Distribution and accept Slack's API terms and developer policy", "Recruit and keep 10+ active pilot workspaces (and their admins' approval)", "Host the public landing, privacy and support pages, and staff support with a 2-business-day response time", "Record the demo video, provide a test workspace and accounts for reviewers, and submit the listing", "Respond to reviewer feedback rounds"]}, "tests": [{"check": "OIDC discovery document", "method": "curl https://slack.com/.well-known/openid-configuration", "result": "200 JSON. issuer https://slack.com, authorization_endpoint https://slack.com/openid/connect/authorize, token_endpoint https://slack.com/api/openid.connect.token, scopes_supported [openid, profile, email], grant_types_supported [authorization_code], token_endpoint_auth_methods_supported [client_secret_post, client_secret_basic].", "supports": "OIDC exists only for Sign in with Slack. API scopes are not advertised there; the v2 endpoints are separate."}, {"check": "OAuth v2 authorize with dummy client_id", "method": "curl 'https://slack.com/oauth/v2/authorize?client_id=oauth-runway-probe&scope=channels:read&redirect_uri=https://example.com/cb'", "result": "HTTP 200 with a ~4KB HTML stub whose script redirects to the same URL plus &tracked=1. No HTTP-level error: an invalid client is reported only l 50 users have linked, and from that point you have two weeks before new links freeze, so apply the day you hit 50. Use token_access_type=offline: access tokens last about 4 hours.", "verdict": {"difficulty": 3, "label": "Light review at 50 users", "headline": "No review is needed until 50 users have linked. From then you have two weeks to get production status or new links freeze."}, "timeline": {"first_connection": "15-30 minutes (create app, set scopes and redirect URI, run the code flow against your own account)", "production": "Usable by up to ~50 external users the same day; full production status = time to reach 50 linked users + a few business days of review (plan for 1-2 weeks of review slack)", "hands_on_effort": "2-4 hours (app setup, branding check, production application form)", "wait_detail": "There is no wait to start: development apps can link other users once 'Enable additional users' is on. The review queue only opens at 50 linked users (or earlier via 'Request early review' with a compelling case). Dropbox says it answers nearly all production requests within a few business days. Few community reports give actual durations, so treat the two-week freeze deadline as the real buffer.", "first_connection_short": "15-30 min", "production_short": "50 users + days", "hands_on_short": "2-4 hours"}, "approval": {"needed_for_production": true, "type": "app review", "trigger": "50 linked Dropbox users. From then you have two weeks to apply and be approved. Apps in development status are capped at 500 linked users.", "what_happens_without_it": "Development status links only your own account until you click 'Enable additional users'. After that, others can link (cap 500). If you hit 50 linked users and aren't approved within two weeks, new links are frozen. Unlinking users does not unfreeze the app; only production approval does.", "cost": "None documented.", "evidence": "official", "source_ids": ["s1", "s3"]}, "managed_option": {"composio_managed": "unknown" ust take over.** Write for someone who has never done this with this provider.\n\n## What to investigate\n\n1. **Which developer surface issues the OAuth app** (console URL, account type needed — e.g. a free developer account, a paid plan, a partner org, a sandbox org).\n2. **Creating the app**: required fields (name, logo, homepage, privacy policy, terms, support email, redirect URIs), app types (e.g. GitHub App vs OAuth App, public vs internal), and which one an agent product should choose.\n3. **Scopes**: the scopes an AI agent typically needs (read + write on the core objects), and their sensitivity tier. Identify scopes that trigger review.\n4. **Review / verification / distribution**: what is required before *external* users can connect; what happens without it (warnings, user caps, workspace-only installs, test-user lists); the steps; documented and community-reported **wait times**; costs; common rejection reasons.\n5. **Runtime nuances** that change the integration: token lifetimes, refresh token behavior and expiry, PKCE, redirect URI rules (localhost/https/exact match), admin consent, rate limits that differ for unreviewed apps, per-tenant install requirements.\n6. **Blockers**: concrete symptoms (error messages, rejection emails, stuck reviews) and what to do.\n\n## Attempt what you can (safe, unauthenticated live checks)\n\nYou have no account and must not create one or enter credentials. But you SHOULD run live checks that ground the guide, using `curl` or a fetch tool, and record literally what came back:\n\n- Fetch the provider's OIDC / OAuth discovery document if one exists (e.g. `/.well-known/openid-configuration`, `/.well-known/oauth-authorization-server`) and confirm the authorize/token endpoints and advertised scopes.\n- Request the authorize endpoint with a dummy `client_id` (e.g. `client_id=oauth-runway-probe&redirect_uri=https://example.com/cb&response_type=code`) and record the HTTP status / error. This confirms the endpoint is real and show
