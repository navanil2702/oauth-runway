r cap. Community Management API: plan for 1-3+ months to Standard tier (Development-tier vetting, then building and recording a screencast, then Standard-tier review). LinkedIn publishes no SLA.", "hands_on_effort": "Self-serve: 1-2 hours. Community Management: about 1 day for forms, business email and Page verification, plus building the full integration and recording a narrated screencast for Standard tier.", "wait_detail": "Self-serve products are provisioned instantly. For Community Management, the waits are: (1) the Page super admin approving the app verification link (expires after 30 days); (2) Development-tier vetting of your business email, organization, website and use case; (3) a vetting survey that must be completed within 21 days; (4) Standard-tier review of the screencast, privacy policy and data-storage compliance. LinkedIn says restricted APIs have 'no fixed timeline'. Builders report 4-8 weeks on a fast path and 3+ months on average for Marketing/partner programs. A rejection means creating a new app and starting over. For comparison, LinkedIn's own partner-support guide says Advertising API Standard-tier review 'can take up to 30 business days'.", "first_connection_short": "30-60 min", "production_short": "1-3+ months", "hands_on_short": "1-2 days"}, "approval": {"needed_for_production": false, "type": "none for self-serve products; partner program (Community Management / Advertising API vetting, Development then Standard tier) for anything beyond sign-in and posting as the member", "trigger": "Requesting any scope outside openid/profile/email/w_member_social. That includes w_organization_social, r_organization_social, rw_organization_admin, w_member_social_feed and r_member_postAnalytics, which come only with the Community Management API (or Advertising API).", "what_happens_without_it": "Self-serve apps work for any LinkedIn member with no warning screen or user cap, but they can only sign the user in (name, photo, email) and create posts as them (150 requests/member/day). Requesting a non-provisioned scope fails at the authorize step. Community Management Development tier (once vetted) is capped at 500 calls/app/day and 100 calls/member/day, with no BATCH_GET and no webhook push. You must reach Standard tier within 12 months.", "cost": "No fee. LinkedIn's API terms say the APIs are currently free but it may charge in future (quoted via a third-party guide). Community Management requires a registered legal organization and a business email address.", "evidence": "official", "source_ids": ["s1", "s4", "s5", "s8", "s12"]}, "managed_option": {"composio_managed": "unknown", "when_you_need_your_own": "Managed OAuth apps for LinkedIn typically carry only the self-serve scopes. You need your own app when you want your brand on the consent screen, your own rate-limit bucket (150 posts/member/day and 100k/app/day are per app), or Community Management scopes. Those are granted per app after vetting and cannot be borrowed."}, "prerequisites": [{"item": "A personal LinkedIn account for the developer", "why": "The Developer Portal requires a signed-in member to create and own apps."}, {"item": "A LinkedIn Page (company Page) to associate the app with", "why": "Every app is tied to one Page that becomes its publisher. The tie is permanent and the app cannot be moved to another Page. Individual developers must still pick a default Page."}, {"item": "Access to a super admin of that Page", "why": "Page verification of the app is required for Community Management (and other vetted products). Only a super admin can approve it, within 30 days."}, {"item": "Registered legal entity, business email on your domain, website and privacy policy", "why": "Required only for the Community Management API. Personal email addresses fail vetting."}, {"item": "App logo and name that contain no part of 'LinkedIn', 'Linked', 'In' or Microsoft marks", "why": "Using these is a stated rejection reason for Community Management review."}], "phases": [{"name": "Create the app", "goal": "Get a client ID and secret tied to your LinkedIn Page", "duration": "15-30 minutes", "steps": [{"title": "Sign in to the LinkedIn Developer Portal", "detail": "The /developers/apps/new URL serves a public 'Developers | LinkedIn' page with no anonymous redirect. Creating an app requires a signed-in LinkedIn member.", "owner": "you", "effort": "2 min", "url": "https://www.linkedin.com/developers/apps/new", "evidence": "tested", "source_ids": ["t5", "s3"]}, {"title": "Create (or pick) the LinkedIn Page the app will belong to", "detail": "The app is permanently bound to this Page. Choose your company Page, not a throwaway one, if you will ever apply for Community Management.", "owner": "you", "effort": "5-10 min", "url": "https://www.linkedin.com/help/linkedin/answer/a548360", "evidence": "official", "source_ids": ["s3"]}, {"title": "Fill in app name, Page, privacy policy URL and logo", "detail": "Avoid 'LinkedIn', 'Linked', 'In' and Microsoft names or logos in the app name and logo. An agent can draft the name, generate the logo spec and write the privacy-policy section on LinkedIn data use.", "owner": "agent+you", "effort": "10 min", "evidence": "official", "source_ids": ["s5"]}, {"title": "Agree to the API Terms and create the app", "owner": "you", "effort": "1 min", "evidence": "inferred"}]}, {"name": "Configure & test (self-serve)", "goal": "Complete a real connection with openid/profile/email and w_member_social", "duration": "15-45 minutes", "steps": [{"title": "Products tab: add 'Sign In with LinkedIn using OpenID Connect' and 'Share on LinkedIn'", "detail": "These are the only 'Open Permissions' available to all developers without approval. They grant openid, profile, email and w_member_social instantly.", "owner": "you", "effort": "2 min", "url": "https://www.linkedin.com/developers/apps", "evidence": "official", "source_ids": ["s1"]}, {"title": "Auth tab: add absolute HTTPS redirect URLs", "detail": "URLs must be absolute and may not contain '#'. Query parameters on the registered URL are ignored. The redirect_uri sent at runtime must match a registered URL. Copy the client ID and secret into your secret store.", "owner": "you", "effort": "5 min", "evidence": "official", "source_ids": ["s2"]}, {"title": "Implement the authorization code flow with client secret (server side)", "detail": "GET https://www.linkedin.com/oauth/v2/authorization, then POST https://www.linkedin.com/oauth/v2/accessToken (x-www-form-urlencoded, client_secret in the body). Validate the id_token against the JWKS. The agent can write and test this code.", "owner": "agent", "effort": "1 hour", "evidence": "tested", "source_ids": ["t1", "t2", "t3", "s2"]}, {"title": "Connect your own LinkedIn account end to end", "detail": "Log in and consent on LinkedIn, confirm /v2/userinfo returns your profile, then create a test post through /v2/ugcPosts or /rest/posts.", "owner": "you", "effort": "10 min", "evidence": "official", "source_ids": ["s2", "s6", "s7"]}, {"title": "Build re-authorization handling for 60-day tokens", "detail": "Self-serve apps get no programmatic refresh token. Re-run the authorize redirect before expiry: the consent screen is skipped if the member is still logged in and the token has not expired. On a 401, send the user back through OAuth.", "owner": "agent", "effort": "1-2 hours", "evidence": "official", "source_ids": ["s2", "s9", "s15"]}]}, {"name": "Get Community Management API access (only if you need Page or read access)", "goal": "Unlock organization posting, comments/reactions, Page and post analytics", "duration": "Weeks to months; no published SLA", "steps": [{"title": "Create a NEW app for the Community Management Development tier", "detail": "Official: request the Development tier only on a new developer app that has no other API products; if the app has Sign In, Share, Ads or any pending request, the request button is greyed out. Create a separate app on the same company Page. Once Standard tier is approved, it can be added to an existing app (for example an Ads API app) by citing the approved client ID, after which the vetting app can be discarded. The docs say nothing explicit about adding Sign In with LinkedIn afterwards, so plan for your sign-in/share app and Community Management app to be different client IDs.", "owner": "you", "effort": "10 min", "evidence": "official", "source_ids": ["s12", "s5", "s13"]}, {"title": "Send the Page verification link to a Page super admin and have them approve", "detail": "Settings tab > Verify generates a unique URL. The super admin opens it, signs in and approves. The link expires after 30 days. Approval cannot be undone and makes that admin responsible for the app.", "owner": "you", "effort": "5 min plus waiting on the admin", "url": "https://www.linkedin.com/help/linkedin/answer/a548360", "evidence": "official", "source_ids": ["s3", "s5"]}, {"title": "Request the Community Management API on the Products tab and complete the Development-tier access form", "detail": "Requires the legal org name, registered address, website, privacy policy and a business email (verified by link; personal emails fail). The agent can draft the use-case description and check it against LinkedIn's restricted-use-cases page.", "owner": "agent+you", "effort": "1-2 hours", "evidence": "official", "source_ids": ["s5", "s4"]}, {"title": "LinkedIn vets the developer, organization, domain, use case and Page verification", "detail": "Approval grants the Development tier: 500 calls/app/day, 100/member/day, no BATCH_GET and no webhook push. You must build the use case within 12 months.", "owner": "provider", "effort": "Wait: weeks (community-reported; no official SLA)", "evidence": "official", "source_ids": ["s5", "s4"]}, {"title": "Build the full integration on Development tier", "owner": "agent+you", "effort": "Days to weeks", "evidence": "official", "source_ids": ["s4"]}, {"title": "Record a narrated, high-resolution screencast for each use case and apply for Standard tier", "detail": "The recording must show the complete OAuth consent flow, posting, how commenter personal data is displayed, and analytics. You also supply test credentials, a company and product overview, and a valid privacy policy. The agent can write the shot list and the script.", "owner": "you", "effort": "3-6 hours", "evidence": "official", "source_ids": ["s5"]}, {"title": "Standard-tier review", "detail": "LinkedIn may decline at its discretion even if you meet the criteria. If rejected, you must start over with a new app at Development tier.", "owner": "provider", "effort": "Wait: weeks to months (community-reported)", "evidence": "official", "source_ids": ["s4", "s5", "s8", "s14"]}]}], "config": {"console_url": "https://www.linkedin.com/developers/apps", "authorize_url": "https://www.linkedin.com/oauth/v2/authorization", "token_url": "https://www.linkedin.com/oauth/v2/accessToken", "redirect_uri_rules": "Register absolute HTTPS URLs on the Auth tab. No '#' fragments. Query parameters on registered URLs are ignored. The runtime redirect_uri must match a registered one, and the same value must be sent to the token endpoint. Loopback http://127.0.0.1:{port} or http://[::1]:{port} applies only to the native PKCE flow.", "pkce": "Not available by default. The native-client PKCE flow (https://www.linkedin.com/oauth/native-pkce/authorization, loopback redirects, no secret) must be enabled by your LinkedIn point of contact, so it is effectively partner-only. Web and agent backends use the confidential-client code flow with client_secret.", "refresh_tokens": "Access tokens last 60 days (expires_in=5184000). Programmatic refresh tokens (365-day fixed TTL that does not reset on use) are given only to approved Marketing Developer Platform partners, for example Community Management or Advertising API apps. Self-serve apps must 'refresh' by re-running the authorize redirect, which is silent only if the member is still logged in and the token has not expired. Requesting a different scope set invalidates all of that member's prior tokens for the app. The auth code lives 30 minutes.", "scopes": [{"scope": "openid", "tier": "basic (self-serve)", "note": "Sign In with LinkedIn using OpenID Connect; returns an id_token (RS256, pairwise sub)."}, {"scope": "profile", "tier": "basic (self-serve)", "note": "Name, given/family name, picture, locale. No headline, employer or connections via OIDC userinfo."}, {"scope": "email", "tier": "basic (self-serve)", "note": "Primary email; the email and email_verified fields may be absent."}, {"scope": "w_member_social", "tier": "basic (self-serve)", "note": "Share on LinkedIn: create posts as the member. 150 requests/member/day, 100k/app/day. Write-only: there is no self-serve way to read the member's posts or feed."}, {"scope": "w_member_social_feed", "tier": "product-gated", "note": "Community Management API: create, modify and delete comments and reactions as the member."}, {"scope": "r_member_postAnalytics / r_member_profileAnalytics", "tier": "product-gated", "note": "Community Management API: member post and profile analytics."}, {"scope": "w_organization_social / w_organization_social_feed", "tier": "product-gated", "note": "Community Management or Advertising API: post and manage social actions as a Company Page. The user must hold a Page admin role."}, {"scope": "r_organization_social / r_organization_social_feed", "tier": "product-gated", "note": "Read Page posts, comments and reactions."}, {"scope": "rw_organization_admin", "tier": "product-gated", "note": "Manage Pages and read Page reporting; the member must be ADMINISTRATOR."}, {"scope": "r_basicprofile", "tier": "product-gated", "note": "Headline and public profile URL; only via the Community Management or Advertising API."}, {"scope": "rw_ads / r_ads / r_ads_reporting", "tier": "product-gated", "note": "Advertising API (Development tier: edit up to 5 ad accounts)."}, {"scope": "r_sales_nav_*", "tier": "partner-only", "note": "SNAP partner program."}, {"scope": "r_compliance / w_compliance", "tier": "closed", "note": "Not requestable."}], "evidence": "official", "source_ids": ["s1", "s2", "s4", "s6", "s7", "s9", "s10", "t1", "s15"]}, "gotchas": [{"title": "Self-serve access cannot read anything an agent would want", "detail": "Open permissions are limited to sign-in (name, photo, email) and w_member_social (post as the member). The agent cannot read the user's feed, their own posts, messages, connections or comments. r_member_social is closed to new requests (per a third-party guide). Plan an agent around 'draft and publish posts for the user' or apply for Community Management.", "impact": "blocker", "evidence": "official", "source_ids": ["s1", "s8"]}, {"title": "Community Management requires a legal entity, a business email and a Page-verified app", "detail": "Only registered legal organizations with commercial use cases qualify. Personal emails fail vetting. A super admin of the app's Page must approve the verification link within 30 days. Solo developers and side projects cannot get it.", "impact": "blocker", "evidence": "official", "source_ids": ["s5", "s3", "s14"]}, {"title": "Community Management Development tier needs a fresh app, so plan for two client IDs", "detail": "LinkedIn says to request the Development tier only on a new developer app with no other API products. Apps with Sign In with LinkedIn, Share on LinkedIn or Ads get a greyed-out request button. After Standard tier is approved it can be moved onto an existing app (e.g. an Ads API app) by citing the approved client ID; the docs do not say whether Sign In with LinkedIn can be added afterwards. An agent that wants both OIDC login and Page management should plan for a separate app, with its own consent and tokens, for the Community Management scopes.", "impact": "nuance", "evidence": "official", "source_ids": ["s12", "s13"]}, {"title": "Rejection means a new app, not a resubmission", "detail": "If the Development or Standard tier request is rejected you cannot reapply with that app. You must create a new app and restart from the Development-tier form (this applies to both Development and Standard tier). A vetting appeal through the Developer Support contact form is a separate path that applies only to identity-vetting denials. Keep Community Management on a dedicated app, and get the use case right against the restricted-use-cases list before submitting.", "impact": "delay", "evidence": "official", "source_ids": ["s5", "s14"]}, {"title": "The app is permanently bound to one LinkedIn Page", "detail": "Apps cannot be transferred to another Page. A rebrand, acquisition or deactivated Page means recreating apps and making every user reconnect.", "impact": "nuance", "evidence": "official", "source_ids": ["s3"]}, {"title": "No refresh tokens for self-serve apps: 60-day hard expiry", "detail": "Without MDP partner status there is no refresh_token grant. A background agent will lose access after 60 days unless the user comes back through the authorize redirect (silent only if they are still logged in and the token is unexpired). Programmatic refresh tokens (365-day fixed TTL) are available only to a limited set of approved partners (e.g. MDP / vetted marketing APIs). Track expiry and prompt users to re-connect.", "impact": "delay", "evidence": "official", "source_ids": ["s2", "s9", "s15"]}, {"title": "Requesting a different scope set kills existing tokens", "detail": "If a member authorizes with a different scope set, all previous access tokens for your app are invalidated. Users must also accept all requested scopes; partial consent is not possible.", "impact": "nuance", "evidence": "official", "source_ids": ["s2", "s15"]}, {"title": "OIDC issuer is 'https://www.linkedin.com/oauth', not what the docs show", "detail": "The live discovery document returns issuer 'https://www.linkedin.com/oauth', while the Sign In docs sample shows 'https://www.linkedin.com'. Strict OIDC libraries validate iss, so configure from the live discovery URL, not from the docs sample.", "impact": "nuance", "evidence": "tested", "source_ids": ["t1", "s6"]}, {"title": "Development-tier Community Management limits are tiny", "detail": "500 calls/app/day and 100 calls/member/day, no BATCH_GET and no social-action webhooks. That is fine for a demo and unusable for production. You must reach Standard within 12 months.", "impact": "delay", "evidence": "official", "source_ids": ["s4"]}, {"title": "PKCE / public clients are not self-serve", "detail": "The native PKCE flow needs LinkedIn to enable it for your app via a point of contact. A CLI or desktop agent without a backend cannot do LinkedIn OAuth with self-serve access, so route it through a server that holds client_secret.", "impact": "nuance", "evidence": "official", "source_ids": ["s10"]}, {"title": "Marketing API versions sunset on a rolling schedule", "detail": "Versioned /rest APIs are retired regularly (for example 202511 sunsets on 2026-11-16). Pin a LinkedIn-Version header and budget for upgrades.", "impact": "nuance", "evidence": "official", "source_ids": ["s4"]}, {"title": "Vetting survey must be completed within 21 days", "detail": "Vetted products auto-generate a survey in the Developer Portal. If it is not submitted within 21 days (or follow-up questions sent to your business email go unanswered), the request is marked 'Insufficient Details'. In that case a Reapply option allows resubmitting on the same app, unlike an outright rejection.", "impact": "delay", "evidence": "official", "source_ids": ["s12"]}], "blockers": [{"symptom": "'Community Management API' request button is greyed out on the Products tab", "what_to_do": "The Development tier can only be requested on a new app with no other API products or pending requests. Create a new app on the same company Page and request it there. After Standard tier approval you can add it to an existing app by citing the approved client ID.", "evidence": "official", "source_ids": ["s12", "s13"]}, {"symptom": "Authorize page shows: The passed in client_id is invalid \"<id>\" (HTTP 200 HTML page, not a redirect)", "what_to_do": "Copy the client ID exactly from the app's Auth tab. Make sure you are not using a deleted app's ID.", "evidence": "tested", "source_ids": ["t2"]}, {"symptom": "Authorize fails with 'Invalid scope' or unauthorized_scope_error", "what_to_do": "The scope is not provisioned for the app. Check the Auth tab's scope list and add the product on the Products tab. For org/feed scopes you need Community Management approval.", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "Redirect_uri doesn't match (401 on authorize) or invalid_redirect_uri 'appid/redirect uri/code verifier does not match authorization code' on token exchange", "what_to_do": "Register the exact absolute HTTPS URL and send the identical redirect_uri to both endpoints. This also fires if the 30-minute code expired; restart the flow.", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "Token endpoint 401 {\"error\":\"invalid_request\",\"error_description\":\"Unable to retrieve access token: authorization code not found\"}", "what_to_do": "The code was already used, mistyped or expired. Codes are single-use with a 30-minute life; restart authorization.", "evidence": "tested", "source_ids": ["t3", "s2"]}, {"symptom": "API calls return 401 {\"serviceErrorCode\":65604,\"code\":\"EMPTY_ACCESS_TOKEN\"} or a 401 after weeks", "what_to_do": "Missing Bearer header, or the 60-day token expired or was revoked or superseded by a new scope set. Send the user back through OAuth.", "evidence": "tested", "source_ids": ["t6", "s2"]}, {"symptom": "Community Management request rejected", "what_to_do": "Read the reason, fix the use case, business email or Page verification, then create a NEW app and submit a new Development-tier form; the old app cannot reapply. For identity-vetting denials, file a vetting appeal through the Developer Support contact form.", "evidence": "official", "source_ids": ["s5", "s12", "s14"]}, {"symptom": "Page super admin never approved, or the verification link shows expired", "what_to_do": "Links expire after 30 days. Generate a new one from Settings > Verify and get it to a current super admin. An unclaimed Page or unreachable admin blocks the whole request.", "evidence": "official", "source_ids": ["s3"]}, {"symptom": "Review stuck with no response", "what_to_do": "Check for an auto-generated vetting survey in the Developer Portal (it must be completed within 21 days), then open a ticket on the Developer Support portal.", "evidence": "official", "source_ids": ["s12", "s4"]}], "handoff": {"agent_can": ["Write the full server-side OAuth code flow (authorize redirect, state check, token exchange, id_token validation against the live JWKS and issuer 'https://www.linkedin.com/oauth', userinfo call)", "Implement post creation via /v2/ugcPosts or /rest/posts, including the image/video register-upload-post sequence", "Build token-expiry tracking and the silent re-authorization redirect for 60-day tokens", "Probe the endpoints and verify redirect URI and scope configuration once given the client ID", "Draft the privacy-policy section covering LinkedIn data use, storage and deletion", "Draft the Community Management use-case description and check it against LinkedIn's restricted-use-cases page", "Write the Standard-tier screencast shot list and narration script per use case (OAuth consent, post, comment display, personal-data fields shown, analytics)"], "you_must": ["Sign in to the Developer Portal with your LinkedIn account and create the app (agree to the API Terms)", "Own or create the LinkedIn Page the app will be permanently tied to", "Get a Page super admin to open and approve the verification link within 30 days", "Supply the legal entity name, registered address and website, and verify a business email (Community Management)", "Decide whether your agent can live with post-only scopes or needs Community Management", "Record the narrated screencast and supply reviewer test credentials for Standard tier", "Connect your own LinkedIn account for end-to-end testing"]}, "tests": [{"check": "OIDC discovery document", "method": "curl https://www.linkedin.com/oauth/.well-known/openid-configuration", "result": "200 JSON: issuer \"https://www.linkedin.com/oauth\", authorization_endpoint https://www.linkedin.com/oauth/v2/authorization, token_endpoint https://www.linkedin.com/oauth/v2/accessToken, userinfo https://api.linkedin.com/v2/userinfo, jwks_uri https://www.linkedin.com/oauth/openid/jwks, response_types [code], subject_types [pairwise], RS256, scopes_supported [openid, profile, email].", "supports": "Endpoints and the self-serve OIDC scopes. Contradicts the docs sample issuer 'https://www.linkedin.com'."}, {"check": "Authorize endpoint with dummy client_id", "method": "curl 'https://www.linkedin.com/oauth/v2/authorization?response_type=code&client_id=oauth-runway-probe&redirect_uri=https%3A%2F%2Fexample.com%2Fcb&scope=openid%20profile&state=x'", "result": "HTTP 200 HTML page titled 'Authorize | LinkedIn' with alert text: The passed in client_id is invalid \"oauth-runway-probe\". No redirect to the redirect_uri. Same result with scope=w_organization_social.", "supports": "The authorize endpoint is live. A bad client ID shows an error page rather than the documented 401."}, {"check": "Token endpoint, authorization_code grant with dummy values", "method": "POST https://www.linkedin.com/oauth/v2/accessToken grant_type=authorization_code&code=dummy&client_id=oauth-runway-probe&client_secret=dummy&redirect_uri=https://example.com/cb", "result": "HTTP 401 {\"error\":\"invalid_request\",\"error_description\":\"Unable to retrieve access token: authorization code not found\"}. Identical with code_verifier instead of client_secret.", "supports": "Token endpoint and error shape match the docs' error table."}, {"check": "Token endpoint, client_credentials and refresh_token grants with dummy values", "method": "POST accessToken grant_type=client_credentials / grant_type=refresh_token", "result": "client_credentials: HTTP 400 {\"error\":\"invalid_client_id\",\"error_description\":\"The passed in client_id is invalid \\\"oauth-runway-probe\\\"\"}. refresh_token: HTTP 400 {\"error\":\"invalid_grant\",\"error_description\":\"The provided authorization grant or refresh token is invalid, expired or revoked.\"}", "supports": "Error shapes. The refresh_token grant exists at the endpoint (availability per app is partner-gated per the docs)."}, {"check": "Developer console reachability", "method": "curl -L https://www.linkedin.com/developers/apps/new and /developers/apps", "result": "Both return HTTP 200 with title 'Developers | LinkedIn' and no anonymous redirect to a login URL. App creation itself needs a signed-in member (not exercised).", "supports": "Console URL is live. The first human step is signing in."}, {"check": "Userinfo without a token", "method": "curl https://api.linkedin.com/v2/userinfo", "result": "HTTP 401 {\"status\":401,\"serviceErrorCode\":65604,\"code\":\"EMPTY_ACCESS_TOKEN\",\"message\":\"Empty oauth2 access token\"}", "supports": "Userinfo endpoint is live and its error shape."}, {"check": "JWKS", "method": "curl https://www.linkedin.com/oauth/openid/jwks", "result": "HTTP 200 with RSA keys (kty RSA, e AQAB, kid present).", "supports": "id_token signature validation is possible."}], "sources": [{"id": "s1", "title": "Getting Access to LinkedIn APIs (Open Permissions, partner programs)", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/getting-access", "kind": "official", "accessed": "2026-10-27"}, {"id": "s2", "title": "LinkedIn 3-Legged OAuth Flow", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow", "kind": "official", "accessed": "2026-10-27"}, {"id": "s3", "title": "Associate an app with a LinkedIn Page (LinkedIn Help)", "url": "https://www.linkedin.com/help/linkedin/answer/a548360", "kind": "official", "accessed": "2026-10-27"}, {"id": "s4", "title": "Increasing Access (Marketing API tiers and permissions)", "url": "https://learn.microsoft.com/en-us/linkedin/marketing/increasing-access", "kind": "official", "accessed": "2026-10-27"}, {"id": "s5", "title": "Community Management App Review", "url": "https://learn.microsoft.com/en-us/linkedin/marketing/community-management-app-review", "kind": "official", "accessed": "2026-10-27"}, {"id": "s6", "title": "Sign In with LinkedIn using OpenID Connect", "url": "https://learn.microsoft.com/en-us/linkedin/consumer/integrations/self-serve/sign-in-with-linkedin-v2", "kind": "official", "accessed": "2026-10-27"}, {"id": "s7", "title": "Share on LinkedIn", "url": "https://learn.microsoft.com/en-us/linkedin/consumer/integrations/self-serve/share-on-linkedin", "kind": "official", "accessed": "2026-10-27"}, {"id": "s8", "title": "LinkedIn API Pricing: Complete Guide for 2026 (Blotato, updated 2026-10-15)", "url": "https://www.blotato.com/blog/linkedin-api-pricing", "kind": "community", "accessed": "2026-10-27"}, {"id": "s9", "title": "Refresh Tokens with OAuth 2.0 (programmatic refresh tokens)", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/programmatic-refresh-tokens", "kind": "official", "accessed": "2026-10-27"}, {"id": "s10", "title": "Authenticating with OAuth 2.0 for Native Clients (PKCE)", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow-native", "kind": "official", "accessed": "2026-10-27"}, {"id": "s11", "title": "Marketing Quick Start (apply for API access)", "url": "https://learn.microsoft.com/en-us/linkedin/marketing/quick-start", "kind": "official", "accessed": "2026-10-27"}, {"id": "s12", "title": "LinkedIn API Partner Support guide (vetting survey, appeals, Community Management sole-product FAQ)", "url": "https://learn.microsoft.com/en-us/linkedin/shared/linkedin-api-partner-support-guide", "kind": "official", "accessed": "2026-10-27"}, {"id": "t1", "title": "Live check: OIDC discovery document", "url": "https://www.linkedin.com/oauth/.well-known/openid-configuration", "kind": "test", "accessed": "2026-10-27"}, {"id": "t2", "title": "Live check: authorize endpoint with dummy client_id", "url": "https://www.linkedin.com/oauth/v2/authorization", "kind": "test", "accessed": "2026-10-27"}, {"id": "t3", "title": "Live check: token endpoint error shapes", "url": "https://www.linkedin.com/oauth/v2/accessToken", "kind": "test", "accessed": "2026-10-27"}, {"id": "t5", "title": "Live check: Developer Portal reachability", "url": "https://www.linkedin.com/developers/apps/new", "kind": "test", "accessed": "2026-10-27"}, {"id": "t6", "title": "Live check: userinfo without token", "url": "https://api.linkedin.com/v2/userinfo", "kind": "test", "accessed": "2026-10-27"}, {"id": "s13", "title": "Verification: Community Management API overview FAQ (B6)", "url": "https://learn.microsoft.com/en-us/linkedin/marketing/community-management/community-management-overview", "kind": "official", "accessed": "2026-10-27"}, {"id": "s14", "title": "Verification: Community Management app review (B6)", "url": "https://learn.microsoft.com/en-us/linkedin/marketing/community-management-app-review", "kind": "official", "accessed": "2026-10-27"}, {"id": "s15", "title": "Verification: 3-legged OAuth authorization code flow (B7)", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow", "kind": "official", "accessed": "2026-10-27"}], "uncertainties": ["Community Management review times: LinkedIn publishes no SLA ('no fixed timeline' for restricted APIs). The only timing figures found (4-8 weeks fast path, 3-4 months average, 6+ months slow) come from one 2026 third-party guide about Marketing/partner programs, not from first-hand forum reports. No Reddit or Stack Overflow data points were found.", "Whether a Page verification is needed for the self-serve products: the Help article says a Page association is required to create an app and verification is needed 'for certain functionality'. Official docs tie verification explicitly only to Community Management. Not verified for Sign In / Share without an account.", "That r_member_social is closed to new requests comes from the third-party guide (s8). It does not appear in the official open-permissions list, which supports the claim but does not state it.", "The exact Developer Portal create-app form fields (privacy policy URL required vs optional, logo size) were not observed because app creation needs a signed-in account.", "The authorize endpoint returned an HTTP 200 error page for an invalid client_id, whereas the docs list 401. The exact behavior for a valid client with an unprovisioned scope or mismatched redirect could not be tested without a real client ID.", "Composio managed-auth support for LinkedIn and which scopes it carries were not researched.", "Whether Sign In with LinkedIn (OIDC) can be added to an app that already holds Standard-tier Community Management access: LinkedIn's docs (re-checked 2026-10-27) say nothing explicit about it."], "meta": {"generated_at": "2026-10-27", "generated_by": "OAuth Runway investigator agent (Claude)", "mode": "library", "reviewed": "On 2026-10-27 fact-checkers re-verified the Community Management app rules (B6, partly) and self-serve token lifetimes (B7, confirmed). Corrected 'must be the only product on its app' to 'request Development tier on a new app with no other products; Standard tier can later be added to an existing app'; still unverified whether Sign In with LinkedIn can be added to that app afterwards.", "collection": "library"}}, {"id": "notion", "name": "Notion", "provider": "Notion Labs (Notion Developer portal)", "website": "https://developers.notion.com", "category": "Docs & knowledge base", "summary": "Notion is mostly self-serve. You create a public connection (OAuth) in the Developer portal, pick 'Any workspace' as the installation scope, and can complete your first connection in under an hour. The Authorization URL appears in the Configuration tab only after you submit the public connection for review; the optional Marketplace listing is a separate security review that takes 5-10 business days. The thing that matters most for an agent is the access model: the agent sees only the pages each user picks in Notion's page picker at consent. The alternative is Notion's remote MCP server, which needs no app registration, sees everything the user can see, and forces users to reconnect at least every 180 days.", "verdict": {"difficulty": 2, "label": "Self-serve", "headline": "No Marketplace review is needed for OAuth, but the Authorization URL appears only after you submit the public connection for review. What decides the outcome is the installation scope ('Any workspace', which can't be changed later) and the per-page access each user grants at consent."}, "timeline": {"first_connection": "30-60 minutes to configure; the portal shows the Authorization URL only after you submit the public connection for review", "production": "As soon as the public connection has been submitted for review and its Authorization URL appears in the Configuration tab (Notion documents no wait for this). Add 1-3 weeks if you list on the Marketplace (a separate security review, 'within 5-10 business days' per Notion, plus any resubmit).", "hands_on_effort": "2-4 hours: OAuth plumbing, refresh handling (store the new refresh token each time), handling the page picker and empty access. Add about half a day for a Marketplace listing (copy, images, logo).", "wait_detail": "The Authorization URL field populates only after the public connection is submitted for review (current Authorization guide; the public-connections guide just says to find it in the Configuration tab, and older 'once made public' wording is superseded). Notion documents no duration for that step. Marketplace listing is a separate security review: 'within 5-10 business days via email' per Notion. Rejections over brand/trademark or quality add a resubmit cycle.", "first_connection_short": "30-60 min", "production_short": "Days (no stated wait)", "hands_on_short": "2-4 hours"}, "approval": {"needed_for_production": false, "type": "submission for review (to get the Authorization URL) + marketplace listing (optional)", "trigger": "Submitting the public connection for review is what populates the Authorization URL in the Configuration tab. A Marketplace listing is a separate review ('The Notion team reviews every listing submission'); the getting-started guide says public connections undergo a Notion security review before being listed on the Marketplace. Listing is only possible with installation scope 'Any workspace'.", "what_happens_without_it": "Your connection still works through its OAuth flow ('Public connections work independently of Marketplace listings'). Users reach it only via your own install link, not through Marketplace discovery. With 'Selected workspaces only', only the workspaces you picked can install it.", "cost": "No fees documented. Rate limits depend on the installing workspace's plan, not on your app: 600 requests/min per connection on Business/Enterprise, 180 requests/min on other plans.", "evidence": "official", "source_ids": ["s2", "s3", "s4", "s8", "s18"]}, "managed_option": {"composio_managed": "unknown", "when_you_need_your_own": "You need your own public connection when you want your own name and logo on the consent screen, your own Marketplace listing, a duplicated template during install, or control over which capabilities are requested and how tokens are refreshed. Notion MCP is an alternative that avoids a REST app entirely: clients self-register via dynamic client registration or CIMD."}, "prerequisites": [{"item": "A Notion account and a development workspace", "why": "A public connection is created inside the Developer portal and tied to a development workspace."}, {"item": "HTTPS redirect URI(s) on your backend", "why": "Redirect URIs must be registered on the connection, and the token exchange must happen server-side with the client secret (HTTP Basic auth)."}, {"item": "Decide on the installation scope before creating the connection", "why": "'Any workspace' vs 'Selected workspaces only' can't be changed after creation. Only 'Any workspace' can be listed on the Marketplace."}, {"item": "Privacy policy and terms URLs, plus a logo (if you plan to list)", "why": "These are required for a Marketplace listing. Older community guides say they were required to make any integration public."}], "phases": [{"name": "Create the public connection", "goal": "Get an OAuth client ID and secret that any workspace can install.", "duration": "15-30 minutes", "steps": [{"title": "Sign in to the Notion Developer portal", "detail": "Go to Build > Public connections > Create new connection. The portal requires a logged-in Notion session (the integrations dashboard URL returns a 200 app shell; auth happens client-side).", "owner": "you", "effort": "2 min", "url": "https://app.notion.com/developers/connections", "evidence": "official", "source_ids": ["s3"]}, {"title": "Choose installation scope 'Any workspace'", "detail": "This is the only option that lets arbitrary users install and the only one that can be listed on the Marketplace. It can't be changed later; changing it means creating a new connection and asking every user to reconnect.", "owner": "you", "effort": "1 min (decision)", "evidence": "official", "source_ids": ["s3", "s4"]}, {"title": "Fill in name, development workspace, redirect URI(s) and capabilities", "detail": "For a read/write agent, choose Read, Update and Insert content, plus Read and Insert comments. Choose 'User information without email' unless you need emails. Fewer capabilities make admin approval more likely, and changing capabilities later forces users to re-authenticate.", "owner": "agent+you", "effort": "10 min", "evidence": "official", "source_ids": ["s3", "s9"]}, {"title": "Optionally add a public template page", "detail": "If you configure a template, users can duplicate it at install time instead of picking pages. Your agent then gets a known page (duplicated_template_id) and doesn't depend on users picking the right pages.", "owner": "you", "effort": "10 min", "evidence": "official", "source_ids": ["s1"]}, {"title": "Copy the client ID and client secret from the Configuration tab", "detail": "Store the secret in your secrets manager. The Authorization URL is not available yet: it populates only after you submit the public connection for review (next step).", "owner": "you", "effort": "5 min", "evidence": "official", "source_ids": ["s1", "s3", "s18"]}, {"title": "Submit the public connection for review, then copy the Authorization URL", "detail": "Per the current Authorization guide, the Authorization URL field in the Configuration tab populates only after the public connection is submitted for review. This is separate from the optional Marketplace listing review.", "owner": "you", "effort": "5 min + undocumented wait", "evidence": "official", "source_ids": ["s1", "s18"]}]}, {"name": "Configure & test the OAuth flow", "goal": "Connect your own workspace end-to-end and handle page selection, token refresh and rate limits.", "duration": "2-4 hours", "steps": [{"title": "Implement the authorize redirect", "detail": "GET https://api.notion.com/v1/oauth/authorize?client_id=...&redirect_uri=...&response_type=code&owner=user&state=... The endpoint 302-redirects to app.notion.com/install-integration, where the user picks a workspace and pages.", "owner": "agent", "effort": "20 min", "evidence": "tested", "source_ids": ["s1", "s15"]}, {"title": "Exchange the code server-side", "detail": "POST https://api.notion.com/v1/oauth/token with HTTP Basic auth (client_id:client_secret) and JSON {grant_type: authorization_code, code, redirect_uri}. Include redirect_uri if it was in the authorize URL or if you registered more than one. Store access_token, refresh_token, bot_id, workspace_id and owner.", "owner": "agent", "effort": "30 min", "evidence": "official", "source_ids": ["s1", "s5", "s16"]}, {"title": "Implement refresh and store the newest refresh token", "detail": "Use grant_type=refresh_token. Each refresh returns a new access token and a new refresh token. The docs don't say whether the old refresh token stops working, so persist the newest one atomically and serialize refreshes per connection. refresh_token may be null, so handle that case.", "owner": "agent", "effort": "45 min", "evidence": "official", "source_ids": ["s1", "s6", "s19"]}, {"title": "Handle 'connected but sees nothing'", "detail": "After consent, the agent can access only the pages and databases the user selected in the page picker, and their children. Use the search endpoint to list what was shared, and show a 'share more pages' prompt that re-runs OAuth. Since the June 8, 2026 changelog, each successful authorization (including re-auth) mints a fresh token pair for new public connections (existing connections keep the old behavior), so replace the stored tokens.", "owner": "agent", "effort": "1 hour", "evidence": "official", "source_ids": ["s1", "s7", "s20"]}, {"title": "Connect your own workspace and a second test workspace", "detail": "After the connection has been submitted for review and the Authorization URL is available, complete the flow as yourself, then from a different workspace to confirm 'Any workspace' installs work.", "owner": "you", "effort": "15 min", "evidence": "inferred"}, {"title": "Add 429 handling", "detail": "Respect Retry-After. Limits are 180 requests/min per connection (600 on Business/Enterprise), about 3 requests/s for data-source queries, plus a per-workspace budget shared across all connections in that workspace.", "owner": "agent", "effort": "30 min", "evidence": "official", "source_ids": ["s8", "s7"]}]}, {"name": "Go to production (optional Marketplace listing)", "goal": "Let any user install the connection, optionally with Marketplace discovery.", "duration": "As soon as the connection is submitted for review if you don't list; 1-3 weeks with a Marketplace listing", "steps": [{"title": "Ship your own 'Connect Notion' button", "detail": "With 'Any workspace' scope, this is production. No user cap or unverified-app warning is documented.", "owner": "agent+you", "effort": "30 min", "evidence": "official", "source_ids": ["s4"]}, {"title": "Draft the Marketplace listing", "detail": "Name, description, category, tags, images, logo and the linked public connection. Save it as a draft under Listings.", "owner": "agent+you", "effort": "2-4 hours", "evidence": "official", "source_ids": ["s4"]}, {"title": "Submit the listing for review", "detail": "Submit from Listings > Connections, then track it under Submitted.", "owner": "you", "effort": "5 min", "evidence": "official", "source_ids": ["s4"]}, {"title": "Notion reviews the listing", "detail": "Notion says to 'expect to hear back from our team within 5-10 business days via email'. It also says public connections undergo a security review before Marketplace listing.", "owner": "provider", "effort": "5-10 business days", "evidence": "official", "source_ids": ["s4", "s2"]}, {"title": "Address feedback and resubmit if rejected", "detail": "Notion lists brand/trademark issues, quality concerns and unmet baseline criteria as rejection reasons.", "owner": "agent+you", "effort": "1-3 hours per cycle", "evidence": "official", "source_ids": ["s4"]}]}], "config": {"console_url": "https://app.notion.com/developers/connections", "authorize_url": "https://api.notion.com/v1/oauth/authorize (params: client_id, redirect_uri, response_type=code, owner=user, state). It 302-redirects to https://app.notion.com/install-integration.", "token_url": "https://api.notion.com/v1/oauth/token (HTTP Basic client_id:client_secret, JSON body; grant types authorization_code and refresh_token)", "redirect_uri_rules": "Redirect URIs must be registered on the connection. redirect_uri in the token request is required if it was sent on the authorize URL or if more than one URI is registered. Use HTTPS in production. Whether localhost is accepted isn't documented on the pages we read.", "pkce": "REST public connections: not documented; they use a confidential client with a secret. Notion MCP (mcp.notion.com): PKCE S256 is mandatory per the docs and advertised in the discovery metadata.", "refresh_tokens": "REST: a refresh_token (nullable) is returned; each refresh returns a new access_token and a new refresh_token. The docs don't say whether the old refresh token is invalidated, so store the new one each time. Since the June 8, 2026 changelog, new public connections also get a fresh access/refresh pair on every successful OAuth authorization (including re-auth); existing connections keep the old behavior. That is not refresh-token rotation. Access-token lifetime isn't documented and the token response has no expires_in; older community guides say tokens never expire. Notion MCP: access tokens last about 8 hours; refresh tokens have a 180-day absolute cap from first authorization, expire after 30 days of inactivity, rotate on each refresh (at most 2 valid at once), and reusing a rotated refresh token can revoke the whole connection.", "scopes": [{"scope": "capability: Read content", "tier": "basic", "note": "Notion uses capabilities configured on the connection, not OAuth scope strings. Access is also limited to pages the user selects."}, {"scope": "capability: Update content", "tier": "basic", "note": "Needed for edits."}, {"scope": "capability: Insert content", "tier": "basic", "note": "Needed to create pages, blocks and database rows."}, {"scope": "capability: Read comments / Insert comments", "tier": "basic"}, {"scope": "capability: User information with email addresses", "tier": "basic", "note": "Doesn't trigger review, but more capabilities make admin approval less likely. Prefer 'without email'."}, {"scope": "MCP: default", "tier": "basic", "note": "The only resource scope advertised by mcp.notion.com. Acts with the user's full Notion permissions."}, {"scope": "MCP: ema_issuer:manage", "tier": "product-gated", "note": "Advertised in the MCP discovery metadata. Appears related to enterprise-managed authorization (inferred). OIDC identity scopes are granted only to clients Notion allows."}], "evidence": "official", "source_ids": ["s1", "s5", "s6", "s9", "s12", "s17", "s19", "s20"]}, "gotchas": [{"title": "Agent sees only the pages the user picks at consent", "detail": "The consent screen includes a page picker. The connection gets access only to the selected pages and databases and their children, and only pages the user has full access to appear. Users who skip selecting pages leave your agent with an empty workspace. Mitigations: provide a template to duplicate, detect empty search results and prompt users to re-run OAuth to add pages, and tell users to pick a top-level teamspace page.", "impact": "blocker", "evidence": "official", "source_ids": ["s1"]}, {"title": "Installation scope is permanent", "detail": "'Selected workspaces only' can never become 'Any workspace' and isn't Marketplace-eligible. Picking it by mistake means creating a new connection and having every user reconnect.", "impact": "blocker", "evidence": "official", "source_ids": ["s3", "s4"]}, {"title": "Authorization URL appears only after submitting for review", "detail": "The current Authorization guide says 'The Authorization URL field populates after a public connection is submitted for review', in the Configuration tab. The public-connections guide only says to find it there and does not contradict this; older 'once made public' wording is superseded. Submit the connection early so this doesn't block your first outside-workspace test. Marketplace listing is a separate security review.", "impact": "delay", "evidence": "official", "source_ids": ["s1", "s3", "s18"]}, {"title": "Each refresh returns a new refresh token; store it and avoid concurrent refreshes", "detail": "On REST, each refresh returns a new access token and a new refresh token. The docs don't say whether the old refresh token is invalidated, so store the newest one atomically and don't refresh the same grant in parallel. On MCP, refresh tokens do rotate: reusing a rotated-away refresh token can revoke the entire connection, and invalid_grant should be treated as final.", "impact": "delay", "evidence": "official", "source_ids": ["s6", "s12", "s19"]}, {"title": "Re-authorization mints a new token pair (since June 8, 2026)", "detail": "Per the June 8, 2026 changelog, new public connections get a fresh access_token and refresh_token for each successful OAuth authorization, including re-auth; previously the existing active token was returned. Existing connections keep the old behavior. A 'share more pages' re-auth must replace the stored tokens. This is a change to authorization, not refresh-token rotation.", "impact": "nuance", "evidence": "official", "source_ids": ["s7", "s20"]}, {"title": "Changing capabilities forces every user to re-auth", "detail": "For public connections, users must re-authenticate if capabilities change. Request the full read/write set up front.", "impact": "nuance", "evidence": "official", "source_ids": ["s9"]}, {"title": "Rate limits depend on the customer's plan and are shared per workspace", "detail": "The limit is 180 requests/min per connection on Free/Plus and 600 on Business/Enterprise, plus a per-workspace limit shared with all other connections in that workspace (added June 2026). Data-source queries are capped at about 3 requests/s. An agent doing bulk reads in a busy workspace can get 429s even when under its own limit.", "impact": "nuance", "evidence": "official", "source_ids": ["s8", "s7"]}, {"title": "Notion MCP is a different trade-off", "detail": "mcp.notion.com supports dynamic client registration and CIMD, so there's no app to create or review. It acts with the user's full permissions, with no page picker. Its tokens work only with MCP, not the REST API. Refresh tokens expire after 180 days from first authorization regardless of use, so users must reconnect. Enterprise workspace owners can restrict members to an approved list of AI apps, which blocks unapproved clients. Guests can't connect.", "impact": "nuance", "evidence": "official", "source_ids": ["s10", "s11", "s12", "s13", "s17"]}, {"title": "Internal connections are single-workspace only", "detail": "An internal connection token (or personal access token) works for one workspace and requires manually sharing pages with it. It's fine for prototyping, but not for letting your users connect their own Notion.", "impact": "nuance", "evidence": "official", "source_ids": ["s2"]}], "blockers": [{"symptom": "Token exchange returns 401 {\"error\":\"invalid_client\"}", "what_to_do": "Check that you're using HTTP Basic auth with client_id:client_secret from the public connection's Configuration tab (not an internal token), and that the secret wasn't rotated.", "evidence": "tested", "source_ids": ["s16"]}, {"symptom": "Token exchange returns 400 invalid_grant", "what_to_do": "The code was already used or expired, or redirect_uri doesn't match. For refresh, you may have used an older refresh token instead of the newest one returned (the docs don't say whether old ones are invalidated). Re-run the authorization; don't retry the same refresh.", "evidence": "official", "source_ids": ["s6", "s12", "s19"]}, {"symptom": "OAuth succeeds but search returns no pages, or the API returns object_not_found", "what_to_do": "The user didn't select those pages in the picker. Send them back through OAuth to add pages, or have them use '...' > Connections on the page in Notion.", "evidence": "official", "source_ids": ["s1"]}, {"symptom": "No Authorization URL in the Configuration tab", "what_to_do": "Submit the public connection for review; the Authorization URL field populates only after submission (Configuration tab).", "evidence": "official", "source_ids": ["s1", "s18"]}, {"symptom": "A user's workspace admin blocks the install, or an Enterprise workspace blocks your MCP client", "what_to_do": "Request fewer capabilities. For MCP, the workspace owner must add your client to the approved AI apps list (Enterprise).", "evidence": "official", "source_ids": ["s9", "s13"]}, {"symptom": "Marketplace listing rejected", "what_to_do": "Read the emailed reason (brand/trademark, quality or baseline criteria), fix it and resubmit from Listings. Your OAuth flow keeps working in the meantime.", "evidence": "official", "source_ids": ["s4"]}, {"symptom": "429 rate_limited even at low traffic", "what_to_do": "This may be the per-workspace limit (other connections in that workspace). Honor Retry-After and the rate_limit_reason in the body, and back off.", "evidence": "official", "source_ids": ["s7", "s8"]}], "handoff": {"agent_can": ["Write the authorize redirect, the server-side code exchange (Basic auth) and refresh handling that stores the newest refresh token, with per-connection locking", "Build the 'connected but no pages shared' detection (empty search) and the re-auth prompt copy that tells users which pages to select", "Pick the minimal capability set and draft the capability list to enter in the portal", "Write 429 backoff using Retry-After and rate_limit_reason", "Draft the Marketplace listing text (description, tags, category) plus the privacy-policy section on what Notion content the agent reads and stores", "Probe the endpoints (authorize, token, MCP discovery) to confirm the configuration, as done in this guide", "If going the MCP route: implement PKCE S256, dynamic client registration or CIMD, and handling for refresh expiry at 180 days or after 30 days of inactivity"], "you_must": ["Log in to the Notion Developer portal and create the public connection (choose 'Any workspace'; this can't be changed later)", "Submit the public connection for review in the Developer portal so the Authorization URL populates", "Store the client secret in your secrets manager", "Decide the capabilities, including whether you need user emails", "Complete the first OAuth connection with your own Notion account and select pages in the picker", "If listing: provide the logo, images and brand assets, submit the listing, and answer reviewer emails", "Host the privacy policy and terms pages"]}, "tests": [{"check": "REST authorize endpoint with a dummy client_id", "method": "curl GET https://api.notion.com/v1/oauth/authorize?client_id=oauth-runway-probe&redirect_uri=https://example.com/cb&response_type=code&owner=user", "result": "HTTP 302 to https://app.notion.com/install-integration?response_type=code&client_id=oauth-runway-probe&redirect_uri=https%3A%2F%2Fexample.com%2Fcb&owner=user. The install page itself returned HTTP 200 (a client-rendered app), so an invalid client_id isn't rejected at the HTTP level.", "supports": "The authorize URL is correct and consent happens on app.notion.com. A misconfigured client isn't caught until the install page renders."}, {"check": "REST token endpoint with dummy credentials (authorization_code and refresh_token grants)", "method": "curl POST https://api.notion.com/v1/oauth/token -u oauth-runway-probe:dummy with a JSON body", "result": "HTTP 401 {\"error\":\"invalid_client\",\"request_id\":\"...\"} for both grant types", "supports": "Token URL, Basic client auth, the refresh_token grant being accepted as a grant type, and the error shape."}, {"check": "OAuth discovery on api.notion.com", "method": "curl GET https://api.notion.com/.well-known/oauth-authorization-server", "result": "HTTP 400 {\"object\":\"error\",\"status\":400,\"code\":\"invalid_request_url\",\"message\":\"Invalid request URL.\"}", "supports": "The REST API has no discovery document, so hard-code its endpoints."}, {"check": "Notion MCP authorization-server metadata", "method": "curl GET https://mcp.notion.com/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource", "result": "HTTP 200. issuer https://mcp.notion.com; authorize /authorize; token /token; registration_endpoint /register; scopes_supported [default, ema_issuer:manage]; code_challenge_methods_supported [S256]; token_endpoint_auth_methods include none and private_key_jwt; client_id_metadata_document_supported true; grant types include the jwt-bearer / ID-JAG profile. The resource is named 'Notion MCP (Beta)'.", "supports": "MCP supports DCR, CIMD, PKCE and public clients, and enterprise-managed auth."}, {"check": "Notion MCP endpoint and authorize with an unknown client", "method": "curl POST https://mcp.notion.com/mcp; GET /authorize?client_id=oauth-runway-probe...; POST /token", "result": "/mcp returned HTTP 401 with WWW-Authenticate: Bearer realm=\"OAuth\", resource_metadata=\".../.well-known/oauth-protected-resource/mcp\", scope=\"default\". /authorize returned 400 {\"error\":\"invalid_request\",\"error_description\":\"Invalid client_id\"}. /token returned 401 {\"error\":\"invalid_client\",\"error_description\":\"Client not found\"}.", "supports": "MCP validates clients strictly, unlike the REST authorize endpoint, so you must register (DCR/CIMD) first."}, {"check": "Unauthenticated REST call", "method": "curl GET https://api.notion.com/v1/users/me", "result": "HTTP 401 {\"code\":\"unauthorized\",\"message\":\"Authorization header must use the format \\\"Bearer <token>\\\".\"}", "supports": "Bearer token auth on the REST API."}, {"check": "Developer console reachability", "method": "curl GET https://www.notion.so/profile/integrations", "result": "HTTP 200 (client-rendered shell; login is enforced in the browser, not by a redirect)", "supports": "The first human step is signing in to Notion in a browser."}], "sources": [{"id": "s1", "title": "Notion Developers: Authorization (public connection OAuth flow)", "url": "https://developers.notion.com/guides/get-started/authorization", "kind": "official", "accessed": "2026-10-27"}, {"id": "s2", "title": "Notion Developers: Getting started (internal vs public connections)", "url": "https://developers.notion.com/docs/getting-started", "kind": "official", "accessed": "2026-10-27"}, {"id": "s3", "title": "Notion Developers: Public connections", "url": "https://developers.notion.com/guides/get-started/public-connections", "kind": "official", "accessed": "2026-10-27"}, {"id": "s4", "title": "Notion Developers: List on the Marketplace", "url": "https://developers.notion.com/guides/get-started/marketplace-listing", "kind": "official", "accessed": "2026-10-27"}, {"id": "s5", "title": "Notion API reference: Create a token", "url": "https://developers.notion.com/reference/create-a-token", "kind": "official", "accessed": "2026-10-27"}, {"id": "s6", "title": "Notion API reference: Refresh a token", "url": "https://developers.notion.com/reference/refresh-a-token", "kind": "official", "accessed": "2026-10-27"}, {"id": "s7", "title": "Notion Developers: Changelog", "url": "https://developers.notion.com/page/changelog", "kind": "official", "accessed": "2026-10-27"}, {"id": "s8", "title": "Notion API reference: Request limits", "url": "https://developers.notion.com/reference/request-limits", "kind": "official", "accessed": "2026-10-27"}, {"id": "s9", "title": "Notion API reference: Connection capabilities", "url": "https://developers.notion.com/reference/capabilities", "kind": "official", "accessed": "2026-10-27"}, {"id": "s10", "title": "Notion Developers: Notion MCP overview", "url": "https://developers.notion.com/docs/mcp", "kind": "official", "accessed": "2026-10-27"}, {"id": "s11", "title": "Notion Developers: Connect to Notion MCP", "url": "https://developers.notion.com/guides/mcp/get-started-with-mcp", "kind": "official", "accessed": "2026-10-27"}, {"id": "s12", "title": "Notion Developers: Build an MCP client for Notion", "url": "https://developers.notion.com/guides/mcp/build-mcp-client", "kind": "official", "accessed": "2026-10-27"}, {"id": "s13", "title": "Notion Help Center: Notion MCP (admin controls)", "url": "https://www.notion.com/help/notion-mcp", "kind": "official", "accessed": "2026-10-27"}, {"id": "s14", "title": "Nango: How to register your own Notion API OAuth app (older; says no refresh tokens)", "url": "https://nango.dev/docs/api-integrations/notion/how-to-register-your-own-notion-api-oauth-app.md", "kind": "community", "accessed": "2026-10-27"}, {"id": "s15", "title": "Live check: REST authorize endpoint with a dummy client_id", "url": "https://api.notion.com/v1/oauth/authorize", "kind": "test", "accessed": "2026-10-27"}, {"id": "s16", "title": "Live check: REST token endpoint with dummy credentials", "url": "https://api.notion.com/v1/oauth/token", "kind": "test", "accessed": "2026-10-27"}, {"id": "s17", "title": "Live check: Notion MCP OAuth metadata, /authorize, /token and /mcp", "url": "https://mcp.notion.com/.well-known/oauth-authorization-server", "kind": "test", "accessed": "2026-10-27"}, {"id": "s18", "title": "Verification: Notion Authorization guide: Authorization URL populates after submission for review (B8)", "url": "https://developers.notion.com/guides/get-started/authorization", "kind": "official", "accessed": "2026-10-27"}, {"id": "s19", "title": "Verification: Notion API reference: Refresh a token (B8)", "url": "https://developers.notion.com/reference/refresh-a-token", "kind": "official", "accessed": "2026-10-27"}, {"id": "s20", "title": "Verification: Notion changelog 2026-06-08: new token pair per authorization (B8)", "url": "https://developers.notion.com/page/changelog", "kind": "official", "accessed": "2026-10-27"}], "uncertainties": ["Notion does not say how long the review after submitting a public connection takes, or whether outside workspaces can install it before that review finishes. Plan for a few days and test the Authorization URL with a second workspace before launch.", "The REST access-token lifetime: the token response has no expires_in, and docs don't state it. Older community guides (Nango) say tokens never expire and there are no refresh tokens, which current docs contradict (the refresh_token grant returns a new access and refresh token). Plan for expiry and handle a null refresh_token.", "Exactly which fields are required to create a public connection today (company name, privacy policy, terms, support email were required in the older 'make public' form per community guides). Current docs list only name, workspace, redirect URIs, scope and capabilities.", "Whether localhost or http redirect URIs are accepted for REST public connections. This isn't stated on the pages we read.", "What the Marketplace 'security review' involves (questionnaire? pen-test?) and real-world turnaround. Only Notion's '5-10 business days' figure was found; no community reports on wait times turned up.", "Whether Composio or other managed-auth providers offer a managed Notion OAuth app. Not checked.", "The meaning of the MCP scope 'ema_issuer:manage' is inferred from its name and the enterprise-managed authorization docs.", "We did not exercise MCP dynamic client registration live because it would create a client registration; only the metadata was read.", "Whether the old REST refresh token is invalidated after a refresh: the refresh reference returns a new access_token and refresh_token but does not say (re-checked 2026-10-27). Store the newest refresh token every time."], "meta": {"generated_at": "2026-10-27", "generated_by": "Claude Opus 5.5 (OAuth Runway investigator)", "mode": "library", "reviewed": "On 2026-10-27 a fact-checker re-verified the Authorization URL gate and Notion refresh behavior (B8, partly). Resolved the doc conflict (the Authorization URL appears only after submitting the public connection for review; steps and timeline updated) and replaced 'refresh-token rotation' with 'each refresh returns a new pair', separating the June 8, 2026 per-authorization change; still undocumented whether old refresh tokens are invalidated and how long the submission step takes.", "collection": "library"}}, {"id": "outlook", "name": "Outlook (Microsoft 365 / Outlook.com via Microsoft Graph)", "provider": "Microsoft Entra ID (Microsoft identity platform)", "website": "https://learn.microsoft.com/en-us/graph/outlook-mail-concept-overview", "category": "Email & calendar", "summary": "Registering a multitenant Entra app and connecting your own mailbox takes ~20 minutes and there is no Microsoft app review. Publisher verification (free, via a verified Microsoft AI Cloud Partner Program account) is fast once Partner Center vetting clears, which can take days to weeks. What matters most: in tenants on 'Let Microsoft manage your consent settings' (the default for new tenants), Microsoft's managed consent policy stops end users from consenting to Mail.*/Calendars.*/MailboxSettings.* scopes for any app, verified or not (mail and calendar scopes were added around Nov 2025), so plan on a tenant admin consenting for each customer org.", "verdict": {"difficulty": 3, "label": "Admin consent", "headline": "No Microsoft app review, but tenants on Microsoft's managed default consent policy need an admin to approve Mail/Calendar scopes for each customer org. Verification alone does not lift that."}, "timeline": {"first_connection": "15-30 minutes (your own tenant or a personal Outlook.com account)", "production": "Personal Outlook.com accounts: same day (an unverified label may show). Work/school accounts: 1-3 days for publisher verification if Partner Center is already vetted, 1-4+ weeks if Partner Center vetting is new or stalls. After that, each customer org may still need its admin to consent.", "hands_on_effort": "2-4 hours (app registration, redirect/secret config, domain verification, Partner Center enrollment, admin-consent onboarding page)", "wait_detail": "Microsoft does not review the app itself. The waits are (1) Partner Center legal-business/employment verification for the CPP account, often days but community reports of weeks to months, (2) DNS propagation for publisher-domain verification, and (3) each customer tenant's admin approving consent. That last one is outside your control and is the real driver of time-to-value for B2B.", "first_connection_short": "15-30 min", "production_short": "1 day to 4+ weeks", "hands_on_short": "2-4 hours"}, "approval": {"needed_for_production": true, "type": "brand/consent verification (publisher verification) + per-tenant admin consent", "trigger": "A multitenant app (registered after Nov 8 2020) asking users in other tenants for permissions beyond sign-in/profile. Separately, for every app (not only multitenant ones), Mail.*, Calendars.*, MailboxSettings.*, Contacts.ReadWrite, Contacts.*.Shared, Tasks.*, People.Read and EAS/EWS/IMAP/POP access are excluded from end-user consent in tenants still on the Microsoft-managed default consent policy ('Let Microsoft manage your consent settings').", "what_happens_without_it": "Unverified: with risk-based step-up consent, users in other tenants cannot consent and get a risky/unverified-publisher warning. Tenants that allow only verified-publisher apps block you outright. Even when verified: tenants on the Microsoft-managed default policy, or with user consent disabled, show 'Need admin approval' and require an admin grant via /adminconsent or the admin consent workflow. Personal Microsoft accounts are not governed by tenant consent policies.", "cost": "Free. Publisher verification and CPP enrollment have no fee. Optional Microsoft 365 Certification needs a paid third-party audit (contract with Claranet); the price is not published.", "evidence": "official", "source_ids": ["s1", "s2", "s3", "s4", "s16", "s17"]}, "managed_option": {"composio_managed": "yes", "when_you_need_your_own": "Use your own Entra app once users should see your name (not Composio's) on the Microsoft consent screen, when you need custom scopes or your own throttling budget (Outlook limits are per app per mailbox), or when customer admins must grant tenant-wide consent to an app published by your verified organization. Point the redirect URI at Composio's callback (https://backend.composio.dev/api/v3/toolkits/auth/callback) if you stay on Composio. Existing connections stay on the old auth config until users re-auth."}, "prerequisites": [{"item": "A Microsoft Entra work/school tenant where you hold Application Developer or Application Administrator rights", "why": "Apps registered with a personal Microsoft account can't be publisher verified (MSANotSupported), and creating apps outside a directory is deprecated. A free Entra tenant is fine."}, {"item": "A DNS-verified custom domain in that tenant, matching your company email domain", "why": "The email domain used in CPP verification must match the app's publisher domain or be a DNS-verified custom domain in the tenant; *.onmicrosoft.com does not qualify."}, {"item": "Microsoft AI Cloud Partner Program (formerly MPN) account, Partner Global Account, fully vetted", "why": "Its Partner One ID is what publisher verification attaches to the app. It must be the partner global account (PGA) ID, not a location ID, and the app's tenant must be associated with the PGA. Verification is free."}, {"item": "MFA on the admin user who performs verification", "why": "Verification fails with InteractionRequired unless MFA was performed in the same session."}, {"item": "A test M365 tenant with an Exchange Online mailbox (for example a Microsoft 365 Developer Program sandbox, if eligible) plus a personal Outlook.com account", "why": "So you can test both account types and the admin-consent path."}], "phases": [{"name": "Create the app", "goal": "A multitenant app registration with a client ID and secret", "duration": "15-30 minutes", "steps": [{"title": "Sign in to the Microsoft Entra admin center with a work/school account", "detail": "Entra ID
