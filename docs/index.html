<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OAuth Runway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a tool, not a brochure. Library as a scannable table; guides as a reading column with a sticky side rail. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --sunk: #eceef2;
  --ink: #14171c;
  --muted: #5a6170;
  --line: #dadee6;
  --accent: #2342b8;
  --accent-ink: #ffffff;
  --accent-soft: #e6eafb;
  --ev-tested: #0f7a55;
  --ev-official: #1f62a8;
  --ev-community: #9a5800;
  --ev-inferred: #7254a0;
  --d1: #0f7a55; --d2: #5a8a14; --d3: #b07800; --d4: #c4500e; --d5: #b3261e;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem; --step-0: 0.9375rem; --step-1: 1.125rem; --step-2: 1.4rem; --step-3: 2rem; --step-4: 2.6rem;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --sunk: #1d222b; --ink: #e6e9ef; --muted: #9aa2b1; --line: #2a303b;
    --accent: #8ea3ff; --accent-ink: #0e1116; --accent-soft: #1f2744;
    --ev-tested: #4cc79a; --ev-official: #6eaaf0; --ev-community: #e3a24a; --ev-inferred: #b49ae0;
    --d1: #4cc79a; --d2: #9ccc4f; --d3: #e2b443; --d4: #f08a4b; --d5: #f2706a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --sunk: #1d222b; --ink: #e6e9ef; --muted: #9aa2b1; --line: #2a303b;
  --accent: #8ea3ff; --accent-ink: #0e1116; --accent-soft: #1f2744;
  --ev-tested: #4cc79a; --ev-official: #6eaaf0; --ev-community: #e3a24a; --ev-inferred: #b49ae0;
  --d1: #4cc79a; --d2: #9ccc4f; --d3: #e2b443; --d4: #f08a4b; --d5: #f2706a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--step-0)/1.55 var(--font-body);
}
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: var(--step-4); line-height: 1.05; font-weight: 700; }
h2 { font-size: var(--step-2); line-height: 1.2; font-weight: 650; }
h3 { font-size: var(--step-1); line-height: 1.3; font-weight: 600; }
p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 500 var(--step--1)/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* top bar */
.topbar { border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 700 var(--step-1)/1 var(--font-display); }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); position: relative; overflow: hidden; flex: none; }
.brand-mark::before { content: ""; position: absolute; left: 11px; top: 3px; bottom: 3px; width: 4px; background: repeating-linear-gradient(var(--bg) 0 4px, transparent 4px 8px); }
.topbar .spacer { flex: 1; }
.mode-pill { font: 500 var(--step--1)/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line); padding: 6px 8px; border-radius: 999px; }

/* buttons & inputs */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 var(--step--1)/1 var(--font-body); padding: 9px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input { flex: 1 1 260px; min-width: 0; font: 400 var(--step-1)/1.2 var(--font-body); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; }
.search .btn { padding: 12px 16px; font-size: var(--step-0); }

/* home */
.hero { padding-block: 40px 24px; display: grid; gap: 16px; }
.hero h1 { max-width: 18ch; }
.hero .lede { max-width: 62ch; color: var(--muted); font-size: var(--step-1); }
.hint { font-size: var(--step--1); color: var(--muted); }
.hint button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; margin-right: 10px; }
.section { padding-block: 24px; display: grid; gap: 16px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.lib { width: 100%; border-collapse: collapse; min-width: 760px; }
table.lib th { text-align: left; font: 500 var(--step--1)/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.lib td { padding: 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.lib tr:last-child td { border-bottom: 0; }
table.lib tbody tr { cursor: pointer; }
table.lib tbody tr:hover { background: var(--sunk); }
.app-cell { display: grid; gap: 2px; }
.app-cell a { font-weight: 600; color: var(--ink); text-decoration: none; font-size: var(--step-1); }
.app-cell a:hover { color: var(--accent); }
.tnum { font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font: 500 0.72rem/1 var(--font-mono); padding: 4px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
.tag.live { background: var(--accent-soft); color: var(--accent); }

/* difficulty meter: five runway lights */
.meter { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.meter .lights { display: inline-flex; gap: 3px; }
.meter .lights i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.meter[data-d="1"] .lights i:nth-child(-n+1), .meter[data-d="2"] .lights i:nth-child(-n+2), .meter[data-d="3"] .lights i:nth-child(-n+3), .meter[data-d="4"] .lights i:nth-child(-n+4), .meter[data-d="5"] .lights i:nth-child(-n+5) { background: var(--dc); }
.meter[data-d="1"] { --dc: var(--d1); } .meter[data-d="2"] { --dc: var(--d2); } .meter[data-d="3"] { --dc: var(--d3); } .meter[data-d="4"] { --dc: var(--d4); } .meter[data-d="5"] { --dc: var(--d5); }
.meter .lbl { font-weight: 600; color: var(--dc); font-size: var(--step--1); }

.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.legend > div { display: grid; gap: 4px; }
.explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.explain p { color: var(--muted); max-width: 52ch; }

/* evidence chip */
.ev { display: inline-flex; align-items: center; gap: 5px; font: 500 0.72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; color: var(--evc); }
.ev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--evc); }
.ev[data-ev="tested"] { --evc: var(--ev-tested); }
.ev[data-ev="official"] { --evc: var(--ev-official); }
.ev[data-ev="community"] { --evc: var(--ev-community); }
.ev[data-ev="inferred"] { --evc: var(--ev-inferred); }
.ev[data-ev="inferred"]::before { background: transparent; border: 1.5px solid var(--evc); }
.src { font: 500 0.72rem/1 var(--font-mono); color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 2px 4px; border-radius: 3px; }
.src:hover { color: var(--accent); border-color: var(--accent); }

/* guide */
.guide { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; padding-block: 28px 64px; align-items: start; }
.guide-main { display: grid; gap: 36px; min-width: 0; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 20px; font-size: var(--step--1); }
.rail nav { display: grid; gap: 6px; }
.rail nav a { color: var(--muted); text-decoration: none; }
.rail nav a:hover { color: var(--accent); }
.rail .share { display: grid; gap: 8px; }
.ev-mix { display: grid; gap: 6px; }
.ev-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.ev-bar span { display: block; height: 100%; }
.ev-rows { display: grid; gap: 4px; }
.ev-rows div { display: flex; justify-content: space-between; }
@media (max-width: 900px) {
  .guide { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .rail nav { display: none; }
}

.ghead { display: grid; gap: 14px; }
.ghead .provider { color: var(--muted); }
.ghead .summary { font-size: var(--step-1); max-width: 68ch; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--ev-inferred); background: var(--surface); padding: 12px 14px; border-radius: 6px; font-size: var(--step--1); }

.verdict { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.verdict > div { padding: 16px; display: grid; gap: 6px; align-content: start; border-left: 1px solid var(--line); min-width: 0; }
.verdict > div:first-child { border-left: 0; }
.verdict .big { font: 650 var(--step-1)/1.25 var(--font-display); }
.verdict .small { font-size: var(--step--1); color: var(--muted); }
@media (max-width: 760px) {
  .verdict { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .verdict > div:nth-child(3) { border-left: 0; }
  .verdict > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
.headline { font: 600 var(--step-1)/1.4 var(--font-body); border-left: 3px solid var(--accent); padding-left: 14px; max-width: 70ch; }
.wait { font-size: var(--step--1); color: var(--muted); max-width: 75ch; }

.next { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.next h3 { font-size: var(--step-1); }

.gsec { display: grid; gap: 14px; scroll-margin-top: 16px; }
.kv { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 10px 20px; }
.kv dt { color: var(--muted); font-size: var(--step--1); padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 600px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv dd { margin-bottom: 10px; } }

.phase { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.phase-head { padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--line); }
.phase-head .goal { color: var(--muted); font-size: var(--step--1); flex-basis: 100%; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.step:last-child { border-bottom: 0; }
.step input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.step.done .step-title { text-decoration: line-through; color: var(--muted); }
.step-title { font-weight: 600; }
.step-detail { color: var(--ink); opacity: 0.88; font-size: var(--step-0); margin-top: 4px; max-width: 72ch; }
.step-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: var(--step--1); color: var(--muted); }
.owner { font: 600 0.72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 6px; border-radius: 4px; border: 1px solid currentColor; }
.owner[data-o="agent"] { color: var(--ev-tested); }
.owner[data-o="you"] { color: var(--ink); }
.owner[data-o="provider"] { color: var(--ev-community); }
.owner[data-o="agent+you"] { color: var(--ev-official); }

.items { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.item { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.item:last-child { border-bottom: 0; }
.item .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.impact { font: 600 0.72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 6px; border-radius: 4px; color: var(--surface); }
.impact[data-i="blocker"] { background: var(--d5); }
.impact[data-i="delay"] { background: var(--d3); }
.impact[data-i="nuance"] { background: var(--muted); }
.item .body { color: var(--ink); opacity: 0.88; max-width: 75ch; }

.handoff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 700px) { .handoff { grid-template-columns: minmax(0, 1fr); } }
.handoff > div { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; display: grid; gap: 10px; align-content: start; }
.handoff ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

.scopes { width: 100%; border-collapse: collapse; font-size: var(--step--1); min-width: 520px; }
.scopes th, .scopes td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scopes th { font-family: var(--font-mono); font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.72rem; }
.scopes td:first-child { font-family: var(--font-mono); overflow-wrap: anywhere; }

.tests { display: grid; gap: 10px; }
.test { border-left: 3px solid var(--ev-tested); padding: 4px 0 4px 12px; display: grid; gap: 4px; }
.test .res { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); overflow-wrap: anywhere; }
.sources { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; font-size: var(--step--1); }
.sources li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; }
.sources a { overflow-wrap: anywhere; }
.unc { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); max-width: 75ch; }

/* live generation */
.gen { padding-block: 28px 64px; display: grid; gap: 20px; max-width: 860px; }
.gen-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.log { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: 60vh; overflow-y: auto; font-size: var(--step--1); }
.log li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .k { font: 500 0.72rem/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.log .k[data-k="search"] { color: var(--ev-official); }
.log .k[data-k="fetch"], .log .k[data-k="read"] { color: var(--accent); }
.log .k[data-k="probe"], .log .k[data-k="probe_result"] { color: var(--ev-tested); }
.log .k[data-k="error"] { color: var(--d5); }
.log .t { overflow-wrap: anywhere; }
.log .thought .t { color: var(--muted); font-style: italic; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; margin-right: 6px; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 6px; font-size: var(--step--1); z-index: 20; }
footer { border-top: 1px solid var(--line); padding-block: 20px; color: var(--muted); font-size: var(--step--1); }
textarea.copybox { width: 100%; min-height: 160px; font: 400 var(--step--1)/1.4 var(--font-mono); background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.prereq { display: grid; gap: 6px; }
.prereq ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 75ch; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="#"><span class="brand-mark" aria-hidden="true"></span>OAuth Runway</a>
  <span class="spacer"></span>
  <span class="mode-pill" id="mode"></span>
</div></header>
<main id="app"><div class="wrap section"><p class="muted">Loading guides…</p></div></main>
<footer><div class="wrap">Guides are researched by agents from provider docs, developer reports and live endpoint checks. Every claim is labeled with its evidence. Provider policies change: check source dates before you rely on them.</div></footer>
<script>window.__RUNWAY__ = {"guides": [{"id": "github", "name": "GitHub", "provider": "GitHub (Microsoft)", "website": "https://github.com", "category": "Developer tools / source control", "summary": "GitHub is self-serve: register a GitHub App (preferred) or OAuth App in your account or org settings in about 15 minutes, with no app review, fee or user cap. Flip the GitHub App to 'Any account' (public) and anyone can install it the same day. What decides your rollout is org-level friction, not GitHub approval: each customer org has to install or approve your app, and SAML-SSO orgs need users to reauthorize with an active SSO session.", "verdict": {"difficulty": 2, "label": "Self-serve", "headline": "GitHub has no app review or verification. The only gate is that each customer org's owner has to install your GitHub App (or approve your OAuth App) before the agent can reach private org repos."}, "timeline": {"first_connection": "15-30 minutes", "production": "Same day for personal accounts. For each customer org, it depends on when their owner installs or approves the app (minutes to weeks, set by the customer, not GitHub).", "hands_on_effort": "1-3 hours: register the app, choose permissions, build the callback and refresh handling, and test with your own account plus a test org", "wait_detail": "GitHub has no provider-side wait. The variable waits are customer org owners installing the GitHub App or approving the OAuth App (with OAuth App access restrictions on, the default for new orgs), and enterprise security reviews on the customer's side. A GitHub Marketplace listing (optional) and publisher verification (needed only for paid plans) have their own review, with timing undocumented.", "first_connection_short": "15-30 min", "production_short": "Same day", "hands_on_short": "1-3 hours"}, "approval": {"needed_for_production": false, "type": "none", "trigger": "No GitHub review for any scope or permission. Optional: a Marketplace listing, and publisher verification if you sell paid plans through Marketplace.", "what_happens_without_it": "Nothing. A public GitHub App gets an install page anyone can use. The real limits are per org: private GitHub Apps can only be installed on the owning account, and OAuth Apps get no API access to private org resources until an org owner approves them (OAuth App access restrictions are on by default for new orgs).", "cost": "Free. Only Marketplace paid plans involve verification and financial onboarding.", "evidence": "official", "source_ids": ["s3", "s4", "s5"]}, "managed_option": {"composio_managed": "yes", "when_you_need_your_own": "Composio's managed GitHub auth shows Composio's name on the consent screen and shares its quota across all Composio users. Use your own app for your branding, custom scopes/permissions, a dedicated rate limit, and so enterprise customers' org owners approve an app named after your product."}, "prerequisites": [{"item": "A GitHub account, ideally an organization you own to hold the app", "why": "Org-owned apps survive staff changes. They also get the 15,000/hr rate limit if the org is on Enterprise Cloud."}, {"item": "An HTTPS callback URL (or http://127.0.0.1 for local dev)", "why": "redirect_uri must match a registered callback URL. Loopback can use any port."}, {"item": "A homepage URL", "why": "Required field. A repo URL is acceptable."}, {"item": "A test organization", "why": "To reproduce the org install/approval flow and the private-repo visibility your customers will hit."}], "phases": [{"name": "Create the app", "goal": "Register a GitHub App with least-privilege permissions", "duration": "15-30 minutes", "steps": [{"title": "Decide GitHub App vs OAuth App", "detail": "Choose a GitHub App for an agent: fine-grained per-repo permissions, the user picks repos at install, and it isn't subject to OAuth App access restrictions. Use an OAuth App only if you need enterprise-level access or broad 'act as the user everywhere' scopes like repo.", "owner": "agent+you", "effort": "10 min", "evidence": "official", "source_ids": ["s1"]}, {"title": "Sign in and open Developer settings", "detail": "Use Settings > Developer settings > GitHub Apps > New GitHub App, or the org equivalent at /organizations/<org>/settings/apps/new. It redirects to login when you aren't signed in.", "owner": "you", "effort": "2 min", "url": "https://github.com/settings/apps/new", "evidence": "tested", "source_ids": ["s3", "t4"]}, {"title": "Fill registration fields", "detail": "Name (at most 34 chars, globally unique), homepage URL, up to 10 callback URLs, keep 'Expire user authorization tokens' checked, optionally 'Request user authorization (OAuth) during installation', and Webhook (deselect Active if unused).", "owner": "agent+you", "effort": "10 min", "evidence": "official", "source_ids": ["s3"]}, {"title": "Select permissions", "detail": "A typical agent set: Contents R/W, Issues R/W, Pull requests R/W, Metadata R (mandatory), plus Actions/Checks R if needed. Choose the minimum, because every permission is shown to the installer and widening it later forces each installation to re-approve.", "owner": "agent+you", "effort": "10 min", "evidence": "official", "source_ids": ["s3"]}, {"title": "Set 'Where can this GitHub App be installed?' to Any account", "detail": "'Only on this account' (private) blocks outside users. Public needs no review.", "owner": "you", "effort": "1 min", "evidence": "official", "source_ids": ["s4"]}, {"title": "Generate client secret (and private key if you'll use installation tokens)", "detail": "Store them in your secret manager. Never ship the client secret in client-side code.", "owner": "you", "effort": "5 min", "evidence": "official", "source_ids": ["s2", "s7"]}]}, {"name": "Configure & test", "goal": "Complete a real user connection and token refresh", "duration": "1-2 hours", "steps": [{"title": "Implement the web flow with PKCE S256", "detail": "Send users to https://github.com/login/oauth/authorize with client_id, redirect_uri, state, code_challenge and code_challenge_method=S256 ('plain' is rejected). Exchange the code with a POST to https://github.com/login/oauth/access_token, sending Accept: application/json (otherwise the response is form-encoded).", "owner": "agent", "effort": "30-60 min", "evidence": "official", "source_ids": ["s2", "s6"]}, {"title": "Handle refresh", "detail": "Access tokens (ghu_) last 8h and refresh tokens (ghr_) 6 months. Each refresh rotates both, so persist the new refresh token atomically. On bad_refresh_token, send the user back through the flow.", "owner": "agent", "effort": "30 min", "evidence": "official", "source_ids": ["s2", "s6"]}, {"title": "Install on your account and a test org, then connect", "detail": "Confirm the agent sees only the repos selected at install. Call GET /user/installations to check which orgs the token can reach.", "owner": "you", "effort": "15 min", "evidence": "official", "source_ids": ["s2", "s9"]}, {"title": "Disable wildcard redirect matching", "detail": "Since August 2026 the per-URI wildcard toggle is visible. Apps that had a single callback URL before 2026-08-03 have it on (legacy behavior). Turn it off unless you control every subdomain and path.", "owner": "you", "effort": "2 min", "evidence": "official", "source_ids": ["s8", "s6", "s13"]}]}, {"name": "Roll out to customers", "goal": "External users and orgs connect without friction", "duration": "Same day for you. Per-org timing is set by the customer.", "steps": [{"title": "Share the public install link", "detail": "https://github.com/apps/<slug>/installations/new. No GitHub review is involved.", "owner": "agent", "effort": "5 min", "evidence": "official", "source_ids": ["s4"]}, {"title": "Org owners install the app (or approve the OAuth App)", "detail": "Members can request it, and owners are notified. For OAuth Apps, unapproved apps get no API access to private org resources.", "owner": "provider", "effort": "customer-dependent", "evidence": "official", "source_ids": ["s5"]}, {"title": "Optional: Marketplace listing and publisher verification", "detail": "Only needed for discovery or paid plans. Paid plans require an org-owned app, a verified publisher and financial onboarding.", "owner": "you", "effort": "hours + undocumented review", "evidence": "official", "source_ids": ["s10"]}]}], "config": {"console_url": "https://github.com/settings/apps", "authorize_url": "https://github.com/login/oauth/authorize", "token_url": "https://github.com/login/oauth/access_token", "redirect_uri_rules": "Exact match against up to 10 registered callback URLs. Wildcard (subdomain/subpath) matching is a per-URI toggle and was turned on for apps that had a single callback URL before 2026-08-03. Wildcard matching accepts subpaths; the changelog also mentions subdomains, but the docs say the host must match exactly apart from subdomains, so verify subdomain behavior before relying on it. Loopback callbacks (http://127.0.0.1/path) accept any port. If redirect_uri is omitted, the first callback URL is used.", "pkce": "Supported. S256 only; plain is rejected.", "refresh_tokens": "GitHub App user tokens: 8h access and 6-month refresh, rotated on every use (unless expiry is disabled in settings). OAuth Apps: since Aug 2026, short-lived tokens are default for new apps, and existing apps opt in via the offline_access scope or by forcing expiration app-wide. Turning it on does not expire tokens already issued, and the 6-month refresh-token lifetime counts from last use. Legacy OAuth tokens don't expire. A limit of 10 tokens per user/app/scope applies (older tokens are revoked).", "scopes": [{"scope": "GitHub App: contents (read/write)", "tier": "basic", "note": "Read and write code and files, and create commits. Limited to repos the installer selects."}, {"scope": "GitHub App: issues, pull_requests (read/write)", "tier": "basic", "note": "Core agent actions."}, {"scope": "GitHub App: metadata (read)", "tier": "basic", "note": "Always required."}, {"scope": "GitHub App: administration / organization members (write)", "tier": "admin-consent", "note": "Installers and org owners will scrutinize these. Avoid them unless essential."}, {"scope": "OAuth App: repo", "tier": "admin-consent", "note": "Full read/write on all public and private repos the user can see. For org repos it needs org approval when restrictions are on."}, {"scope": "OAuth App: read:user, user:email", "tier": "basic", "note": "Identity."}, {"scope": "OAuth App: workflow", "tier": "sensitive", "note": "Needed to push changes to .github/workflows files."}, {"scope": "OAuth App: offline_access", "tier": "basic", "note": "Opts into expiring tokens plus a refresh token."}], "evidence": "official", "source_ids": ["s2", "s3", "s6", "s8", "s13"]}, "gotchas": [{"title": "Org approval is the real gate", "detail": "OAuth App access restrictions are on by default for new orgs, and unapproved OAuth Apps can't reach private org resources. The user authorizes successfully but sees no org repos. GitHub Apps avoid that policy but still need an org owner to install them on the org.", "impact": "blocker", "evidence": "official", "source_ids": ["s5", "s1"]}, {"title": "SAML SSO orgs return 403 until the user reauthorizes with an active SSO session", "detail": "Tokens issued without an active SAML session can't touch SSO-enforced org resources. The fix is to have the user start an SSO session and reauthorize.", "impact": "delay", "evidence": "community", "source_ids": ["s11", "s2"]}, {"title": "Refresh tokens rotate on every use", "detail": "Using a refresh token invalidates the old access and refresh tokens. Concurrent refreshes by parallel agent workers will log users out, so serialize refreshes per user.", "impact": "nuance", "evidence": "official", "source_ids": ["s6"]}, {"title": "User tokens share the user's 5,000 req/hr budget", "detail": "The budget is shared with the user's PATs and other apps (15,000/hr if your app's owner org is on Enterprise Cloud). Secondary limits: 100 concurrent requests, about 80 content-creating requests/min, and 2,000 OAuth token requests/hr. Agents that open many PRs or comments hit the content-creation limit first.", "impact": "nuance", "evidence": "official", "source_ids": ["s7"]}, {"title": "10-token cap per user/app/scope", "detail": "Minting an 11th token revokes an older one, and creating more than 10 tokens per hour forces re-authorization. Don't run a new OAuth flow per agent session.", "impact": "nuance", "evidence": "official", "source_ids": ["s6"]}, {"title": "Legacy wildcard redirect matching", "detail": "Apps that had a single callback URL before 2026-08-03 had wildcard matching turned on for that URL. It accepts subpaths (the changelog also mentions subdomains; check this detail). Disable it to avoid code-interception risk.", "impact": "nuance", "evidence": "official", "source_ids": ["s8", "s13"]}, {"title": "No OIDC discovery for github.com sign-in", "detail": "/.well-known/openid-configuration returns 404, so generic OIDC clients won't auto-configure. Hardcode the endpoints. GitHub OAuth doesn't issue id_tokens; call GET /user instead.", "impact": "nuance", "evidence": "tested", "source_ids": ["t1"]}], "blockers": [{"symptom": "User connects but the agent sees no private org repos (empty list or 404 on repo endpoints)", "what_to_do": "For an OAuth App, ask the org owner to approve it under Org settings > Third-party access. For a GitHub App, have the owner install it on the org and select the repos. Check with GET /user/installations.", "evidence": "official", "source_ids": ["s5", "s2"]}, {"symptom": "403 mentioning SAML enforcement for the organization", "what_to_do": "Have the user sign in through their org's SSO, then revoke and reauthorize your app.", "evidence": "community", "source_ids": ["s11"]}, {"symptom": "redirect_uri_mismatch on authorize", "what_to_do": "Make redirect_uri exactly equal one of the registered callback URLs (scheme, host, port, path), or add it (up to 10).", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "Token endpoint returns 404 {\"error\":\"Not Found\"}", "what_to_do": "The client_id doesn't exist (typo, deleted app, or a GitHub App client ID confused with an App ID). Copy the Client ID from the app settings page. A wrong secret for a valid ID gives incorrect_client_credentials instead.", "evidence": "tested", "source_ids": ["t3", "s2"]}, {"symptom": "bad_refresh_token", "what_to_do": "The refresh token is expired (6 months), already used (rotation), or revoked. Restart the web flow for that user.", "evidence": "official", "source_ids": ["s2"]}, {"symptom": "403/429 with retry-after while the agent is writing", "what_to_do": "You've hit a secondary rate limit. Honor retry-after, serialize writes per user, and back off exponentially. Persistent abuse can get the integration banned.", "evidence": "official", "source_ids": ["s7"]}], "handoff": {"agent_can": ["Recommend GitHub App vs OAuth App and draft the minimal permission matrix for your agent's tools", "Write the PKCE web flow, token exchange (Accept: application/json), rotating-refresh storage with per-user locking, and GET /user/installations checks", "Generate the app registration field values (name, description, callback URLs, homepage) and a GitHub App manifest", "Draft the customer-facing 'ask your org owner to install/approve' message and SSO reauthorization help text", "Probe endpoints and run rate-limit-aware integration tests once given a test token"], "you_must": ["Sign in to GitHub (with 2FA) and create the app under your org", "Generate and store the client secret and private key in your secret manager", "Decide the public visibility setting and turn off wildcard redirect matching", "Install the app on your test org and complete the first authorization in a browser", "Coordinate with customer org owners for installs and approvals; handle Marketplace/publisher verification only if you sell through Marketplace"]}, "tests": [{"check": "OIDC / OAuth discovery on github.com", "method": "curl https://github.com/.well-known/openid-configuration and /.well-known/oauth-authorization-server", "result": "Both returned HTTP 404. token.actions.githubusercontent.com does serve an OIDC doc, but it's for Actions workload identity (response_types id_token), not user sign-in.", "supports": "No discovery doc; hardcode endpoints"}, {"check": "Authorize endpoint with dummy client_id", "method": "curl GET https://github.com/login/oauth/authorize?client_id=oauth-runway-probe&redirect_uri=https://example.com/cb&response_type=code (also with code_challenge S256)", "result": "HTTP 302 to https://github.com/login?client_id=oauth-runway-probe&return_to=... The client is not validated before login.", "supports": "Endpoint is live. Client and redirect errors only appear after the user signs in."}, {"check": "Token endpoint with dummy credentials", "method": "curl POST https://github.com/login/oauth/access_token (client_id=oauth-runway-probe, client_secret=x, code=dummy), with and without Accept: application/json; also with a fake Iv1. client id", "result": "HTTP 404. Body {\"error\":\"Not Found\"} with the JSON Accept header, or 'Not Found' without it. The documented incorrect_client_credentials did not appear for an unknown client_id.", "supports": "Unknown client IDs give a 404, not an OAuth error"}, {"check": "Developer console reachability", "method": "curl https://github.com/settings/developers and /settings/apps/new", "result": "HTTP 302 to https://github.com/login?return_to=... for both", "supports": "The first human step is a GitHub login"}, {"check": "API unauthenticated", "method": "curl https://api.github.com/user", "result": "HTTP 401 {\"message\":\"Requires authentication\"}; x-ratelimit-limit: 60", "supports": "The unauthenticated limit is 60/hr"}], "sources": [{"id": "s1", "title": "Differences between GitHub Apps and OAuth apps", "url": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/differences-between-github-apps-and-oauth-apps", "kind": "official", "accessed": "2026-10-27"}, {"id": "s2", "title": "Generating a user access token for a GitHub App", "url": "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app", "kind": "official", "accessed": "2026-10-27"}, {"id": "s3", "title": "Registering a GitHub App", "url": "https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app", "kind": "official", "accessed": "2026-10-27"}, {"id": "s4", "title": "Making a GitHub App public or private", "url": "https://docs.github.com/en/apps/creating-github-apps/setting-up-a-github-app/making-a-github-app-public-or-private", "kind": "official", "accessed": "2026-10-27"}, {"id": "s5", "title": "About OAuth app access restrictions", "url": "https://docs.github.com/en/organizations/managing-oauth-access-to-your-organizations-data/about-oauth-app-access-restrictions", "kind": "official", "accessed": "2026-10-27"}, {"id": "s6", "title": "Authorizing OAuth apps", "url": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps", "kind": "official", "accessed": "2026-10-27"}, {"id": "s7", "title": "Rate limits for the REST API", "url": "https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api", "kind": "official", "accessed": "2026-10-27"}, {"id": "s8", "title": "Changelog: Multiple redirect URIs and token refresh for OAuth apps (2026-08-14)", "url": "https://github.blog/changelog/2026-08-14-multiple-redirect-uris-and-token-refresh-for-oauth-apps", "kind": "official", "accessed": "2026-10-27"}, {"id": "s9", "title": "Authenticating with a GitHub App on behalf of a user", "url": "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-with-a-github-app-on-behalf-of-a-user", "kind": "official", "accessed": "2026-10-27"}, {"id": "s10", "title": "About GitHub Marketplace for apps", "url": "https://docs.github.com/en/apps/github-marketplace/github-marketplace-overview/about-github-marketplace-for-apps", "kind": "official", "accessed": "2026-10-27"}, {"id": "s11", "title": "HashiCorp: VCS connection using GitHub App fails for SSO-enabled GitHub organisations", "url": "https://support.hashicorp.com/hc/en-us/articles/40280096215059-VCS-connection-using-Github-App-fails-for-SSO-enabled-Github-organisations", "kind": "community", "accessed": "2026-10-27"}, {"id": "s12", "title": "Composio: Managed vs custom auth", "url": "https://docs.composio.dev/docs/custom-app-vs-managed-app", "kind": "official", "accessed": "2026-10-27"}, {"id": "t1", "title": "Live check: github.com discovery endpoints (404)", "url": "https://github.com/.well-known/openid-configuration", "kind": "test", "accessed": "2026-10-27"}, {"id": "t2", "title": "Live check: authorize endpoint with dummy client_id (302 to login)", "url": "https://github.com/login/oauth/authorize", "kind": "test", "accessed": "2026-10-27"}, {"id": "t3", "title": "Live check: token endpoint with dummy credentials (404 Not Found)", "url": "https://github.com/login/oauth/access_token", "kind": "test", "accessed": "2026-10-27"}, {"id": "t4", "title": "Live check: developer console redirects to login", "url": "https://github.com/settings/apps/new", "kind": "test", "accessed": "2026-10-27"}, {"id": "s13", "title": "Verification: GitHub changelog 2026-08-14: multiple redirect URIs and token refresh for OAuth Apps (re-checked A1)", "url": "https://github.blog/changelog/2026-08-14-multiple-redirect-uris-and-token-refresh-for-oauth-apps", "kind": "official", "accessed": "2026-10-27"}], "uncertainties": ["Marketplace listing and publisher verification review times are not documented and were not researched in community sources. They only matter if you list or sell on Marketplace.", "Composio's managed GitHub auth was confirmed from search-result summaries of Composio docs (s12), not from a page read in full. Whether Composio uses a GitHub App or an OAuth App for managed auth is unverified.", "We could not observe what the authorize endpoint shows for a bad client_id or redirect_uri after login (no account). Docs say redirect_uri_mismatch, but the exact UI wasn't seen.", "The incorrect_client_credentials error (valid client_id, wrong secret) is documented but untested, because we had no valid client_id. Our probes only produced 404 for unknown IDs.", "The SAML SSO behavior for GitHub App user tokens comes from a community (HashiCorp) article plus doc summaries. The exact 403 message text from GitHub wasn't captured.", "Wildcard redirect matching and subdomains: the 2026-08-14 changelog mentions subdomains, but the docs say the host must match exactly apart from subdomains. Not re-verified on 2026-10-27; test it before relying on subdomain matching. (Short-lived tokens being on by default for new OAuth Apps was confirmed on 2026-10-27.)"], "meta": {"generated_at": "2026-10-27", "generated_by": "Claude Opus 5.5 (OAuth Runway investigator)", "mode": "library", "reviewed": "On 2026-10-27 a fact-checker re-verified the OAuth App expiring-token, 10-redirect-URI and per-URI wildcard claims (A1) against the 2026-08-14 changelog and confirmed them; added opt-in, last-use and pre-2026-08-03 wildcard details. Still unverified: whether wildcard matching covers subdomains, plus the items in uncertainties.", "collection": "library"}}, {"id": "gmail", "name": "Gmail", "provider": "Google Cloud (Google Auth Platform / OAuth consent screen)", "website": "https://developers.google.com/workspace/gmail/api", "category": "Email", "summary": "You can connect your own Gmail in about 30-60 minutes using a Google Cloud project in Testing mode, but you are limited to 100 listed test users and their refresh tokens expire after 7 days. Almost every useful Gmail scope for an agent (readonly, modify, compose, metadata) is classed as restricted. Before arbitrary users can connect you need brand verification, restricted-scope verification and a third-party CASA security assessment (about $500-$4,500 per assessment, paid to the assessor, per Google's Health API verification docs; repeated every year). Plan for 6-10 weeks to reach production, and for more if Trust & Safety stops replying.", "verdict": {"difficulty": 4, "label": "Security assessment", "headline": "Reading or modifying mail requires restricted scopes, and restricted scopes require Google verification plus a paid third-party CASA security assessment that must be repeated every year."}, "timeline": {"first_connection": "30-60 minutes (Testing mode, your own account added as a test user)", "production": "6-10 weeks typical for restricted scopes (Google: 'several weeks'; well-prepared teams report 2-4 weeks; stalls of 1+ month with no reply are reported). Send-only (gmail.send, sensitive) without CASA: about 1-3 weeks.", "hands_on_effort": "1-2 days for the app, homepage, privacy policy, demo video and justifications, plus 2-5 days for the CASA scan, self-assessment questionnaire and remediation", "wait_detail": "There are three waits in sequence. (1) The automated brand verification check finishes in minutes, but takes 2-3 business days if branding changed. (2) Trust & Safety reviews data access (scopes): first responses often come in 1-2 days, but there are documented month-plus stalls, especially after resubmitting through the console instead of replying on the email thread. (3) The CASA assessment starts only after T&S asks for it: about 2-3 weeks at Tier 2 according to Google's figures, longer if the scan finds high or medium issues, and up to a week more for the Letter of Validation to be processed. The main sources of variance are how fast you reply to T&S emails and how clean your first scan is.", "first_connection_short": "30-60 min", "production_short": "6-10 weeks", "hands_on_short": "3-7 days"}, "approval": {"needed_for_production": true, "type": "brand/consent verification + restricted-scope verification + security assessment (CASA)", "trigger": "Publishing an External app that requests any sensitive scope (e.g. gmail.send) triggers verification. Any restricted scope (gmail.readonly, gmail.modify, gmail.compose, gmail.metadata, gmail.insert, gmail.settings.basic, https://mail.google.com/) additionally triggers the security assessment when restricted data is accessed from or through a third-party server, which is always the case for a hosted agent.", "what_happens_without_it": "Testing status: only up to 100 listed test users, and authorizations plus refresh tokens expire 7 days after consent. In production but unverified: users see an 'unverified app' warning, and the app is capped at 100 new users in total until it is verified (verification lifts it; Google may adjust quotas per app). Separately, the user cap on unapproved sensitive or restricted scopes applies over the project's entire lifetime and cannot be reset. Internal (Workspace org) apps avoid both, but only users in your own org can connect.", "cost": "Google verification itself is free. The CASA assessor fee is paid by you: Google's Google Health API app-verification page states about $500-$4,500 per assessment, paid to the third-party assessor and depending on app complexity; Google's general restricted-scope and Gmail pages give no price. Community reports put TAC Security at about $540-$720 and Prescient at $3,000 or more. The MailMate developer cites $540-$1,800 with Google's discount and $1,800-$6,300 without it. Vendor marketing (Nylas, Truto) cites $15k-$75k, which likely reflects the older pre-CASA assessment regime. The assessment must be repeated every year, but Google does not describe the fee as a yearly price.", "evidence": "official", "source_ids": ["s3", "s4", "s5", "s7", "s9", "s10", "s11", "s19", "s17", "s20", "s21"]}, "managed_option": {"composio_managed": "yes", "when_you_need_your_own": "Composio's managed Gmail app shows 'Composio wants to access your account' on Google's consent screen and shares quota across all Composio customers. You need your own Google OAuth app (registered as a custom auth config with Composio's callback URL) for your own branding on the consent screen, custom scopes or dedicated quota. Connections already made stay tied to their original auth config. If you bring your own app, that app has to go through Google verification and CASA itself."}, "prerequisites": [{"item": "A Google account with permission to create Google Cloud projects (ideally a Google Workspace / Cloud Identity org)", "why": "Projects own the OAuth client. An org-owned project lets you use Internal mode for dogfooding and keeps ownership off a personal account."}, {"item": "A domain you own with a public homepage (not just a login page) and a privacy policy on the same domain", "why": "Brand verification requires both, plus domain ownership verified in Google Search Console by a project Owner/Editor."}, {"item": "A privacy policy section on Google user data that includes the Limited Use disclosure", "why": "Restricted-scope review rejects policies that lack it. It must also state no generalized AI/ML model training on user data."}, {"item": "A monitored shared support/developer contact email, with at least two project Owners/Editors", "why": "Trust & Safety, CASA and annual recertification notices go to these addresses. Missed emails stall or revoke access."}, {"item": "Budget for a CASA assessor (about $500-$4,500 per assessment, repeated every year) and access to your source code or a deployed URL for scanning", "why": "Required for restricted Gmail scopes."}, {"item": "Separate Google Cloud projects for dev/staging and production", "why": "Google says only production projects should be submitted for verification. Test projects stay unverified."}], "phases": [{"name": "Create the app", "goal": "A Google Cloud project with Gmail API enabled, a consent screen (Google Auth Platform branding + audience) and a Web OAuth client.", "duration": "20-40 minutes", "steps": [{"title": "Sign in to Google Cloud console and create a project", "detail": "The console redirects unauthenticated visitors to Google sign-in. Create a dedicated production project (and a separate dev project).", "owner": "you", "effort": "5 min", "url": "https://console.cloud.google.com/projectcreate", "evidence": "tested", "source_ids": ["t4"]}, {"title": "Enable the Gmail API", "detail": "APIs & Services > Library > Gmail API > Enable.", "owner": "you", "effort": "1 min", "url": "https://console.cloud.google.com/apis/library/gmail.googleapis.com", "evidence": "inferred"}, {"title": "Configure Branding and choose Audience", "detail": "Google Auth Platform > Branding: app name, user support email, logo, homepage, privacy policy and terms URLs, authorized domains, developer contact email. Audience: choose External for a multi-customer agent. Choose Internal only if all users are in your own Workspace org, since outside users then get org_internal.", "owner": "agent+you", "effort": "15 min", "url": "https://console.cloud.google.com/auth/branding", "evidence": "official", "source_ids": ["s6", "s3"]}, {"title": "Declare scopes on the Data Access page", "detail": "Add exactly the Gmail scopes the agent uses, and nothing extra. Typical agent: gmail.modify (read + label + draft + send, no permanent delete) or gmail.readonly + gmail.send + gmail.compose. Avoid https://mail.google.com/ unless you need permanent delete.", "owner": "agent+you", "effort": "10 min", "url": "https://console.cloud.google.com/auth/scopes", "evidence": "official", "source_ids": ["s2", "s4"]}, {"title": "Create an OAuth client ID of type Web application", "detail": "Add the exact redirect URIs (https, exact match including trailing slash and case; http://localhost is allowed for dev). Store the client secret in your secrets manager.", "owner": "you", "effort": "5 min", "url": "https://console.cloud.google.com/auth/clients", "evidence": "official", "source_ids": ["s8"]}]}, {"name": "Configure & test", "goal": "Complete a real Gmail connection and API call in Testing mode, with refresh handling that survives the 7-day expiry.", "duration": "1-3 hours", "steps": [{"title": "Add test users", "detail": "Audience > Test users: add up to 100 Google accounts (including your own). Only these accounts can authorize while the app is in Testing. A test user counts against the 100-user quota as soon as they are added. Apps that request only basic identity scopes (openid/email/profile) do not need users on the list.", "owner": "you", "effort": "2 min", "url": "https://console.cloud.google.com/auth/audience", "evidence": "official", "source_ids": ["s6", "s17"]}, {"title": "Implement the authorization code flow with offline access", "detail": "Authorize at https://accounts.google.com/o/oauth2/v2/auth with response_type=code, access_type=offline, prompt=consent (to get a refresh token on re-grant), include_granted_scopes=true, and PKCE S256. Exchange the code at https://oauth2.googleapis.com/token.", "owner": "agent", "effort": "1-2 h", "evidence": "tested", "source_ids": ["t1", "s8"]}, {"title": "Handle granular (partial) consent", "detail": "Users can untick individual scopes on the consent screen. Check the granted scopes in the token response and show a re-consent prompt instead of failing silently.", "owner": "agent", "effort": "30 min", "evidence": "official", "source_ids": ["s8", "s9"]}, {"title": "Handle invalid_grant on refresh", "detail": "In Testing, refresh tokens die 7 days after consent. In production they also die on revocation, after 6 months unused, when a user changes password (Gmail scopes), and when the 100-tokens-per-account-per-client limit is exceeded. Mark the connection as needing reauth.", "owner": "agent", "effort": "30 min", "evidence": "official", "source_ids": ["s1"]}, {"title": "Connect your own Gmail and call users.messages.list", "detail": "You will see the 'Google hasn't verified this app' interstitial; click through via Advanced. This is expected until verification.", "owner": "you", "effort": "5 min", "evidence": "official", "source_ids": ["s6"]}]}, {"name": "Get verified for production (brand + restricted scopes + CASA)", "goal": "Verified app with approved restricted Gmail scopes, no unverified warning and no 100-user cap.", "duration": "4-10 weeks elapsed (plan around 6-10)", "steps": [{"title": "Verify your domain in Google Search Console", "detail": "A project Owner/Editor must verify ownership of the homepage, privacy-policy and redirect domains.", "owner": "you", "effort": "15-30 min (DNS TXT)", "url": "https://search.google.com/search-console", "evidence": "official", "source_ids": ["s3", "s4"]}, {"title": "Publish homepage and privacy policy that pass review", "detail": "The homepage must be public and describe the app. The privacy policy must be on the same domain, linked from the homepage and consent screen, and cover how Google user data is accessed, used, stored and shared. It must include the Limited Use statement and say no generalized AI/ML model training on Workspace data.", "owner": "agent+you", "effort": "2-4 h", "evidence": "official", "source_ids": ["s3", "s4", "s12"]}, {"title": "Run Verify Branding and publish branding", "detail": "The automated check usually finishes in minutes. Compliant results expire after 7 days if you do not publish.", "owner": "agent+you", "effort": "10 min + wait", "url": "https://console.cloud.google.com/auth/verification", "evidence": "official", "source_ids": ["s4"]}, {"title": "Click Publish app (Testing to In production)", "detail": "Required before submitting. Unverified production apps still have the warning screen and the cap of 100 new users in total until verification (and the lifetime, non-resettable user cap on unapproved sensitive/restricted scopes).", "owner": "you", "effort": "1 min", "evidence": "official", "source_ids": ["s6", "s5", "s19", "s17"]}, {"title": "Record the demo video", "detail": "English. Show the full OAuth flow with the app name on the consent screen and the client_id visible in the address bar, then show each restricted or sensitive scope being used in the product. Upload to YouTube as Unlisted.", "owner": "you", "effort": "1-2 h", "evidence": "official", "source_ids": ["s4"]}, {"title": "Write per-scope justifications and submit data access verification", "detail": "Explain for each scope which feature uses it and why a narrower scope will not work. Add up to 3 documentation links. Submit in the Verification Center.", "owner": "agent+you", "effort": "1-2 h", "url": "https://console.cloud.google.com/auth/verification", "evidence": "official", "source_ids": ["s4", "s3"]}, {"title": "Trust & Safety review", "detail": "Reply on the same email thread within 24-48 h. Resubmitting through the console instead of replying is reported to orphan the review.", "owner": "provider", "effort": "days to weeks", "evidence": "community", "source_ids": ["s9", "s13"]}, {"title": "Complete the CASA security assessment with an authorized assessor", "detail": "T&S tells you when to start. Pick an App Defense Alliance-authorized lab (e.g. TAC Security). Run the SAST/DAST scan, fix high and medium findings, and complete the self-assessment questionnaire (about 50 questions at Tier 2). The assessor issues a Letter of Validation (LOV) to Google.", "owner": "agent+you", "effort": "2-5 days hands-on, 2-3 weeks elapsed", "url": "https://appdefensealliance.dev/casa", "evidence": "official", "source_ids": ["s7", "s10", "s9"]}, {"title": "Google approves the restricted scopes", "detail": "The warning screen and cap are removed for the approved scopes. Set a reminder: re-verification and CASA reassessment are due every 12 months from the LOV date (Google emails about 90 days ahead).", "owner": "provider", "effort": "up to 1 week after LOV", "evidence": "official", "source_ids": ["s4", "s7", "s9", "s19"]}]}], "config": {"console_url": "https://console.cloud.google.com/auth/overview", "authorize_url": "https://accounts.google.com/o/oauth2/v2/auth", "token_url": "https://oauth2.googleapis.com/token", "redirect_uri_rules": "Must exactly match a registered URI (scheme, case, trailing slash). HTTPS is required except for localhost. No raw IPs (except loopback), wildcards, fragments, userinfo, path traversal or open redirects. The redirect domain should be one of your verified authorized domains.", "pkce": "Supported: the discovery document advertises code_challenge_methods_supported [plain, S256]. Use S256. A confidential web client still sends client_secret.", "refresh_tokens": "Returned only with access_type=offline, and normally only on first consent (use prompt=consent to get a new one). In Testing status (External), refresh tokens expire 7 days after consent unless you only request openid/email/profile. Otherwise refresh tokens are valid until revoked, unused for 6 months, the user changes password (Gmail scopes), the limit of 100 live refresh tokens per Google account per client is exceeded (oldest silently invalidated), time-based access expires, or an admin session-length policy hits. All of these surface as invalid_grant.", "scopes": [{"scope": "https://www.googleapis.com/auth/gmail.modify", "tier": "restricted", "note": "Best single scope for a read+write agent: read, label, draft, send, trash. No permanent delete."}, {"scope": "https://www.googleapis.com/auth/gmail.readonly", "tier": "restricted", "note": "Read messages and settings."}, {"scope": "https://www.googleapis.com/auth/gmail.compose", "tier": "restricted", "note": "Manage drafts and send."}, {"scope": "https://www.googleapis.com/auth/gmail.metadata", "tier": "restricted", "note": "Headers and labels only, but still restricted."}, {"scope": "https://www.googleapis.com/auth/gmail.insert", "tier": "restricted"}, {"scope": "https://www.googleapis.com/auth/gmail.settings.basic", "tier": "restricted", "note": "Filters and settings."}, {"scope": "https://mail.google.com/", "tier": "restricted", "note": "Full access including permanent delete. Request only if you need permanent delete."}, {"scope": "https://www.googleapis.com/auth/gmail.send", "tier": "sensitive", "note": "Send-only. Needs verification but no CASA."}, {"scope": "https://www.googleapis.com/auth/gmail.labels", "tier": "non-sensitive", "note": "Create and edit labels only."}, {"scope": "openid email profile", "tier": "non-sensitive", "note": "Exempt from test-user list and 7-day expiry."}], "evidence": "official", "source_ids": ["s2", "s8", "s1", "t1", "s16", "s18"]}, "gotchas": [{"title": "Almost every useful Gmail scope is restricted, not sensitive", "detail": "Even gmail.metadata (headers only) is restricted. Only gmail.send (sensitive) and gmail.labels (non-sensitive) avoid CASA. If your agent reads mail at all, you are on the restricted path.", "impact": "blocker", "evidence": "official", "source_ids": ["s2", "s16"]}, {"title": "Sensitive vs restricted: verification vs verification + CASA", "detail": "Sensitive scopes need brand verification plus scope review (demo video and justification). Restricted scopes need all of that plus a third-party CASA security assessment, renewed every 12 months, whenever data is accessed from or through your servers.", "impact": "blocker", "evidence": "official", "source_ids": ["s3", "s4", "s7"]}, {"title": "Brand verification is not scope verification", "detail": "Brand verification checks app name, logo, homepage, privacy policy and domain ownership. It is automated, takes minutes (2-3 business days if branding changed), and is a prerequisite. Passing it does not remove the unverified warning for Gmail scopes; only data access (scope) verification does.", "impact": "nuance", "evidence": "official", "source_ids": ["s4", "s5"]}, {"title": "Testing-mode refresh tokens expire after 7 days", "detail": "External apps in Testing status get authorizations that expire 7 days after consent, and the refresh token dies with them (invalid_grant). Long-running agents silently break for beta users each week. Do not run a beta on Testing mode; move to production (unverified, under 100 users) or Internal instead.", "impact": "delay", "evidence": "official", "source_ids": ["s1", "s6", "s18", "s17"]}, {"title": "Two different 100-user limits for unverified apps", "detail": "Unverified production apps are capped at 100 new users in total until verified; verification lifts this cap and Google says quotas may be adjusted per app. Separately, the user cap on unapproved sensitive or restricted scopes applies over the project's entire lifetime and cannot be reset. Testing mode is separately capped at 100 listed test users. Do not burn the cap on a public beta.", "impact": "blocker", "evidence": "official", "source_ids": ["s6", "s5", "s19", "s17"]}, {"title": "No generalized AI model training on Gmail data", "detail": "The Workspace API User Data Policy prohibits using user data to train AI/ML models beyond that user's personalized model, and forbids humans reading data without explicit consent (with narrow exceptions). Your privacy policy and review answers must reflect this. AI-agent apps are scrutinized here.", "impact": "blocker", "evidence": "official", "source_ids": ["s12"]}, {"title": "CASA is annual and costs real money", "detail": "Revalidation is required every 12 months from the LOV date. Adding a new restricted scope can force reassessment. Missing the deadline risks losing access for all users. The fee is charged per assessment (about $500-$4,500 per Google's Health API docs), so each yearly reassessment is paid again.", "impact": "delay", "evidence": "official", "source_ids": ["s4", "s7", "s11", "s20"]}, {"title": "100 refresh tokens per account per client", "detail": "Issuing a 101st refresh token for the same Google account and client silently invalidates the oldest. This bites when users reconnect repeatedly or you create a new token per agent instance. Reuse one token per user.", "impact": "nuance", "evidence": "official", "source_ids": ["s1"]}, {"title": "Password change kills Gmail refresh tokens", "detail": "A user changing their password revokes refresh tokens that contain Gmail scopes. Build a reauth path.", "impact": "nuance", "evidence": "official", "source_ids": ["s1"]}, {"title": "Granular consent: users can grant only some scopes", "detail": "Check the scope field of the token response and request missing scopes incrementally.", "impact": "nuance", "evidence": "official", "source_ids": ["s8", "s9"]}, {"title": "Workspace admins can block you regardless of verification", "detail": "Admins can restrict third-party access (admin_policy_enforced), or conversely trust an unverified app for their domain. Enterprise customers may need to allowlist your client ID.", "impact": "nuance", "evidence": "official", "source_ids": ["s1", "s14"]}], "blockers": [{"symptom": "'Access blocked: Authorization Error ... Error 401: invalid_client ... The OAuth client was not found'", "what_to_do": "The client_id is wrong, deleted, or from another project. Copy it again from Google Auth Platform > Clients. The token endpoint returns the same as JSON {\"error\":\"invalid_client\"} with HTTP 401.", "evidence": "tested", "source_ids": ["t2", "t3"]}, {"symptom": "Error 400: redirect_uri_mismatch", "what_to_do": "Register the exact redirect URI (scheme, host, path, trailing slash, case) on the OAuth client. Changes can take a few minutes to propagate.", "evidence": "official", "source_ids": ["s8"]}, {"symptom": "Error 403: access_denied / 'has not completed the Google verification process' for a beta user", "what_to_do": "The app is in Testing and the account is not on the test-user list. Add the account, or publish to production (subject to the 100-user cap).", "evidence": "official", "source_ids": ["s6"]}, {"symptom": "Error 403: org_internal", "what_to_do": "The consent screen is set to Internal and the user is outside your org. Switch the audience to External.", "evidence": "official", "source_ids": ["s6"]}, {"symptom": "invalid_grant on refresh about a week after connecting", "what_to_do": "This is the 7-day Testing-mode expiry. Publish the app to production or use an Internal app; reconnect affected users.", "evidence": "official", "source_ids": ["s1", "s6"]}, {"symptom": "Verification 'under review' for weeks with no emails", "what_to_do": "Reply on the original T&S email thread (do not just resubmit in console), confirm the contact email is monitored, and after about 10 business days escalate via a paid Google Cloud support case or the developer forum. Community reports show month-plus stalls.", "evidence": "community", "source_ids": ["s13", "s9"]}, {"symptom": "Rejection: scopes not justified / narrower scope available", "what_to_do": "Drop unused scopes (e.g. use gmail.modify instead of mail.google.com, gmail.send if you only send), name the exact feature per scope in the justification, and make sure the consent screen, Data Access page and demo video show the same scope list.", "evidence": "community", "source_ids": ["s9", "s4"]}, {"symptom": "Rejection: homepage/privacy policy issues", "what_to_do": "Host both on a Search Console-verified domain you own. The homepage must be public (not just a login page). Add the Limited Use disclosure and data-handling details.", "evidence": "official", "source_ids": ["s3", "s4"]}, {"symptom": "CASA scan reports high/medium findings", "what_to_do": "Fix and rescan before the deadline. Pre-scan with your own SAST tool before starting the official assessment to avoid paying for revalidation rounds.", "evidence": "community", "source_ids": ["s9"]}], "handoff": {"agent_can": ["Generate the OAuth client config: authorize URL builder with access_type=offline, prompt=consent, include_granted_scopes and PKCE S256, plus token exchange and refresh code with invalid_grant handling", "Choose the minimal Gmail scope set for your features and draft a per-scope justification naming each feature and why narrower scopes fail", "Draft the privacy-policy section on Google user data, including the Limited Use statement, retention and deletion, no generalized AI training, and no human reading without consent", "Draft the homepage copy describing what the agent does with Gmail", "Write a shot-by-shot demo video script that covers the consent screen, the client_id in the URL and each scope in use", "Pre-run a SAST scan and pre-answer the CASA self-assessment questionnaire from your codebase and infra docs, then fix common findings", "Probe the endpoints and check redirect URIs, branding links and domain consistency before submission", "Track the annual recertification date and draft replies to Trust & Safety emails"], "you_must": ["Sign in to Google Cloud console and own the project (create it, enable Gmail API, create the OAuth client, copy the secret)", "Verify domain ownership in Google Search Console (DNS access)", "Decide on scopes and accept Google's API Services User Data Policy and terms", "Record and upload the demo video from your real app", "Click Publish app, submit verification, and personally answer Trust & Safety emails on the thread", "Choose, contract and pay the CASA assessor (about $500-$4,500 per assessment, repeated every year), and grant scanner access", "Add test users and complete the first real consent with your own Google account"]}, "tests": [{"check": "OIDC discovery document", "method": "curl https://accounts.google.com/.well-known/openid-configuration", "result": "200. authorization_endpoint=https://accounts.google.com/o/oauth2/v2/auth, token_endpoint=https://oauth2.googleapis.com/token, revocation_endpoint=https://oauth2.googleapis.com/revoke, scopes_supported=[openid,email,profile] (Gmail scopes are not listed), code_challenge_methods_supported=[plain,S256], grant_types include authorization_code, refresh_token, device_code, jwt-bearer.", "supports": "Endpoint URLs and PKCE S256 support"}, {"check": "Authorize endpoint with dummy client_id", "method": "curl GET /o/oauth2/v2/auth?client_id=oauth-runway-probe&redirect_uri=https://example.com/cb&response_type=code&scope=gmail.readonly", "result": "302 to https://accounts.google.com/signin/oauth/error?authError=... The followed page shows 'Access blocked: Authorization Error', 'Error 401: invalid_client', 'The OAuth client was not found'.", "supports": "Endpoint is live; the error a developer sees with a bad client_id"}, {"check": "Token endpoint with dummy credentials", "method": "curl POST https://oauth2.googleapis.com/token grant_type=authorization_code, dummy code/client", "result": "HTTP 401 {\"error\": \"invalid_client\", \"error_description\": \"The OAuth client was not found.\"}", "supports": "Token endpoint and error shape"}, {"check": "Console reachability", "method": "curl https://console.cloud.google.com/auth/overview and /apis/credentials/consent", "result": "Both 302 to https://accounts.google.com/ServiceLogin?service=cloudconsole...", "supports": "The first human step is Google sign-in to Cloud console"}], "sources": [{"id": "s1", "title": "Using OAuth 2.0 to Access Google APIs (refresh token expiration)", "url": "https://developers.google.com/identity/protocols/oauth2", "kind": "official", "accessed": "2026-10-27"}, {"id": "s2", "title": "Choose Gmail API scopes", "url": "https://developers.google.com/workspace/gmail/api/auth/scopes", "kind": "official", "accessed": "2026-10-27"}, {"id": "s3", "title": "OAuth app verification requirements (Google Cloud Help)", "url": "https://support.google.com/cloud/answer/13464321", "kind": "official", "accessed": "2026-10-27"}, {"id": "s4", "title": "Restricted scope verification", "url": "https://developers.google.com/identity/protocols/oauth2/production-readiness/restricted-scope-verification", "kind": "official", "accessed": "2026-10-27"}, {"id": "s5", "title": "When is verification not needed", "url": "https://support.google.com/cloud/answer/13464323", "kind": "official", "accessed": "2026-10-27"}, {"id": "s6", "title": "Manage App Audience (publishing status, test users, user cap)", "url": "https://support.google.com/cloud/answer/15549945", "kind": "official", "accessed": "2026-10-27"}, {"id": "s7", "title": "Security assessment (CASA, Letter of Validation, annual revalidation)", "url": "https://support.google.com/cloud/answer/13465431", "kind": "official", "accessed": "2026-10-27"}, {"id": "s8", "title": "Using OAuth 2.0 for Web Server Applications", "url": "https://developers.google.com/identity/protocols/oauth2/web-server", "kind": "official", "accessed": "2026-10-27"}, {"id": "s9", "title": "Nango: Google security review guide (verification + CASA)", "url": "https://nango.dev/docs/api-integrations/google-shared/google-security-review", "kind": "community", "accessed": "2026-10-27"}, {"id": "s10", "title": "Google App verification page (search-result summary: Tier 2 2-3 weeks, $500-$4,500 assessor fees)", "url": "https://developers.google.com/health/app-verification", "kind": "official", "accessed": "2026-10-27"}, {"id": "s11", "title": "MailMate mailing list: passed CASA Tier 2 (cost, annual recert)", "url": "https://lists.freron.com/mailmate/2025-April/018278.html", "kind": "community", "accessed": "2026-10-27"}, {"id": "s12", "title": "Google Workspace API User Data and Developer Policy", "url": "https://developers.google.com/workspace/workspace-api-user-data-developer-policy", "kind": "official", "accessed": "2026-10-27"}, {"id": "s13", "title": "Google Developer forum: OAuth Data Access Verification under review 1+ month", "url": "https://discuss.google.dev/t/oauth-data-access-verification-under-review-for-1-month-no-communication/340945", "kind": "community", "accessed": "2026-10-27"}, {"id": "s14", "title": "Nylas: Google OAuth Verification costs and timelines", "url": "https://www.nylas.com/blog/google-oauth-app-verification/", "kind": "community", "accessed": "2026-10-27"}, {"id": "s15", "title": "Composio: Managed vs custom auth / white-labeling", "url": "https://docs.composio.dev/docs/authentication/white-labeling-authentication", "kind": "community", "accessed": "2026-10-27"}, {"id": "t1", "title": "Live check: Google OIDC discovery document", "url": "https://accounts.google.com/.well-known/openid-configuration", "kind": "test", "accessed": "2026-10-27"}, {"id": "t2", "title": "Live check: authorize endpoint with dummy client_id returns invalid_client", "url": "https://accounts.google.com/o/oauth2/v2/auth", "kind": "test", "accessed": "2026-10-27"}, {"id": "t3", "title": "Live check: token endpoint with dummy credentials returns 401 invalid_client", "url": "https://oauth2.googleapis.com/token", "kind": "test", "accessed": "2026-10-27"}, {"id": "t4", "title": "Live check: Cloud console redirects to Google sign-in", "url": "https://console.cloud.google.com/auth/overview", "kind": "test", "accessed": "2026-10-27"}, {"id": "s16", "title": "Verification: Gmail API scopes (A2: metadata restricted, send sensitive, labels non-sensitive)", "url": "https://developers.google.com/workspace/gmail/api/auth/scopes", "kind": "official", "accessed": "2026-10-27"}, {"id": "s17", "title": "Verification: Manage App Audience: test users and lifetime user cap (A3, A4)", "url": "https://support.google.com/cloud/answer/15549945?hl=en", "kind": "official", "accessed": "2026-10-27"}, {"id": "s18", "title": "Verification: Google OAuth 2.0 overview: 7-day Testing refresh tokens (A3)", "url": "https://developers.google.com/identity/protocols/oauth2", "kind": "official", "accessed": "2026-10-27"}, {"id": "s19", "title": "Verification: Unverified apps: 100 new users in total until verified (A4)", "url": "https://support.google.com/cloud/answer/7454865", "kind": "official", "accessed": "2026-10-27"}, {"id": "s20", "title": "Verification: Google Health API app verification: $500-$4,500 per CASA assessment (A4)", "url": "https://developers.google.com/health/app-verification", "kind": "official", "accessed": "2026-10-27"}, {"id": "s21", "title": "Verification: Restricted-scope verification (A4: no price stated)", "url": "https://developers.google.com/identity/protocols/oauth2/production-readiness/restricted-scope-verification", "kind": "official", "accessed": "2026-10-27"}], "uncertainties": ["The CASA fee range (about $500-$4,500 per assessment) was confirmed on 2026-10-27 only on Google's Google Health API app-verification page; Google's general restricted-scope and Gmail pages give no price, so the range may not reflect Gmail apps exactly. The Tier 2 '2-3 weeks' figure was not re-checked. Vendor pages (Nylas, Truto) cite $15k-$75k, which likely reflects the older pre-CASA regime.", "End-to-end restricted-scope timelines are community-reported and vary widely (Nango: 5-20 days when well prepared; forum threads: 1+ month stalls). Google itself says only 'several weeks'. Plan around 6-10 weeks.", "Google's help pages now describe CASA as assurance levels AL1/AL2, while community sources still say 'Tier 2/Tier 3'. I could not confirm which level a typical Gmail agent is assigned; most community reports indicate Tier 2 / AL2.", "The granular-consent timeline ('required since January 2026') is from Nango, not a Google page I opened.", "Console navigation paths (Google Auth Platform > Branding/Audience/Data Access/Clients/Verification Center) were taken from docs. I could not view them without signing in, and Google renames these menus periodically.", "With Composio's callback URL on your own OAuth client, it is unclear whether Google requires the redirect domain (backend.composio.dev) to be one of your verified authorized domains during review; Composio documents an optional redirect proxy through your own domain.", "Whether an AI agent use case (LLM processing of email content) gets extra scrutiny beyond the written AI-training prohibition is anecdotal; it is not documented as a separate gate."], "meta": {"generated_at": "2026-10-27", "generated_by": "OAuth Runway research agent (Claude Opus 5.5)", "mode": "library", "reviewed": "On 2026-10-27 fact-checkers re-verified the Gmail scope tiers (A2) and Testing-mode limits (A3), both confirmed, and the unverified-app cap and CASA cost (A4), which were corrected: the 100-new-user cap lifts on verification (the separate sensitive/restricted-scope user cap is the lifetime, non-resettable one), and $500-$4,500 is a per-assessment fee from Google's Health API page, not a yearly price. Still unverified: the Tier 2 CASA duration and whether the Health API fee range applies to Gmail apps.", "collection": "library"}}, {"id": "linkedin", "name": "LinkedIn", "provider": "LinkedIn (Microsoft)", "website": "https://www.linkedin.com/developers/", "category": "Social / professional network", "summary": "You can create a LinkedIn app and add the self-serve products (Sign In with LinkedIn using OpenID Connect, Share on LinkedIn) in about 30 minutes. There is no review, so any member can connect right away, but that only lets an agent read the user's name, photo and email and post as them. It cannot read their feed, posts or comments. Anything useful beyond that, such as Company Page posting, reading comments or analytics, needs the Community Management API. That API is vetted, open only to registered legal entities, needs your app verified by a LinkedIn Page super admin, and goes through two review tiers that builders report take weeks to months.", "verdict": {"difficulty": 4, "label": "Partner-gated", "headline": "The self-serve scopes (openid, profile, email, w_member_social) only let an agent post as the user. Reading content or managing Company Pages needs Community Management API approval: business entity, Page-verified app, two review tiers, and approval is at LinkedIn's discretion."}, "timeline": {"first_connection": "30-60 minutes (create the app tied to a LinkedIn Page, add the self-serve products, set the redirect URL). Assumes you already have a LinkedIn Page to select.", "production": "Self-serve scopes: same day, with no review and no use
